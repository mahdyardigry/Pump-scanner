<style>
*{box-sizing:border-box}

body{

.section{

.table-wrap{

table{
  width:100%;
  border-collapse:collapse;

}
th,td{

  border-bottom:1px solid #172b37;

.live{

<body>
<div class="container">

  <div class="header">
    <h1>🚀 اسکنر Pump Bybit</h1>
    <div class="subtitle">
      شناسایی Pump واقعی، کندل قرمز، Pullback Zone و Retest بر پایه داده‌های واقعی Bybit
    </div>

    <div id="status" class="status">⏳ در حال اتصال به Worker...</div>

    <div class="controls">
      <button id="startBtn" class="btn-green">▶️ شروع اسکن</button>

    <div class="search">
      <input id="symbolInput" placeholder="BTCUSDT" autocomplete="off">

    <div class="sound-panel">
      <div class="sound-title">🔔 هشدار صوتی</div>

      <div class="sound-row">

          <span>فعال</span>
        </label>

          <span id="volumeText">70%</span>

      <div class="small">

  <div class="stats">
    <div class="stat">
      اسکن
      <b id="scanState">خاموش</b>
    </div>
    <div class="stat">

      <b id="resultCount">0</b>
    </div>
    <div class="stat">
      REACHED
      <b id="reachedCount">0</b>
    </div>
    <div class="stat">
      NEAR
      <b id="nearCount">0</b>
    </div>
  </div>

  <div id="results">
    <div class="empty" id="emptyState">
      هنوز ارزی شناسایی نشده است.
    </div>

</div>

<script>
"use strict";

/* =========================
   تنظیمات
========================= */

const WORKER = "https://pump-scanner.29mah12.workers.dev";

const LIVE_INTERVAL = 3000;
const SCAN_INTERVAL = 10000;

/* =========================
   وضعیت برنامه
========================= */

let scanning = false;
let scanTimer = null;

const cards = new Map();
const closedCoins = new Set();
const alertedStates = new Set();

let audioContext = null;

/* =========================
   تنظیمات صدا
========================= */

let soundEnabled =
  localStorage.getItem("pump_sound_enabled") !== "false";

let soundVolume =
  Number(localStorage.getItem("pump_sound_volume") ?? 70);

if (!Number.isFinite(soundVolume)) soundVolume = 70;
soundVolume = Math.max(0, Math.min(100, soundVolume));

const soundEnabledEl = document.getElementById("soundEnabled");
const soundVolumeEl = document.getElementById("soundVolume");
const volumeTextEl = document.getElementById("volumeText");

soundEnabledEl.checked = soundEnabled;
soundVolumeEl.value = soundVolume;
volumeTextEl.textContent = soundVolume + "%";

soundEnabledEl.addEventListener("change", () => {
  soundEnabled = soundEnabledEl.checked;

  localStorage.setItem(
    "pump_sound_enabled",
    String(soundEnabled)
  );

  unlockAudio();
});

soundVolumeEl.addEventListener("input", () => {
  soundVolume = Number(soundVolumeEl.value);

  localStorage.setItem(
    "pump_sound_volume",
    String(soundVolume)
  );

  volumeTextEl.textContent = soundVolume + "%";
});

/* =========================
   Audio
========================= */

function unlockAudio(){
  try{
    if(!audioContext){
      const AC =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AC) return;

      audioContext = new AC();
    }

    if(audioContext.state === "suspended"){
      audioContext.resume().catch(()=>{});
    }
  }catch(e){}
}

document.addEventListener(
  "pointerdown",
  unlockAudio,
  {once:false}
);

function beep(
  frequency = 700,
  duration = 150,
  delay = 0,
  volumeMultiplier = 1
){
  if(!audioContext) return;

  const now =
    audioContext.currentTime +
    delay / 1000;

  const osc =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(
    frequency,
    now
  );

  const volume =
    Math.max(0, Math.min(1,
      (soundVolume / 100) *
      0.16 *
      volumeMultiplier
    ));

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(
    volume,
    now + 0.015
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + duration / 1000
  );

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.start(now);
  osc.stop(now + duration / 1000 + 0.03);
}

function playAlert(type){
  unlockAudio();

  if(!audioContext) return;

  if(type === "REACHED"){
    beep(880, 150, 0, 1.1);
    beep(1100, 180, 190, 1.15);
    beep(1320, 220, 400, 1.2);
    return;
  }

  if(type === "NEAR"){
    beep(700, 140, 0, 1);
    beep(900, 160, 180, 1);
    return;
  }

  if(type === "APPROACHING"){
    beep(520, 130, 0, 0.8);
  }
}

document
  .getElementById("testSoundBtn")
  .addEventListener("click", () => {
    unlockAudio();

    if(!audioContext) return;

    beep(600, 120, 0, 1);
    beep(850, 140, 170, 1);
    beep(1100, 180, 370, 1);
  });

/* =========================
   Helpers
========================= */

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function num(value, digits=4){
  const n = Number(value);

  if(!Number.isFinite(n)){
    return "-";
  }

  return n.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:digits
    }
  );
}

function pct(value, digits=2){
  const n = Number(value);

  if(!Number.isFinite(n)){
    return "-";
  }

  return n.toFixed(digits) + "%";
}

function stateClass(state){
  switch(String(state || "").toUpperCase()){
    case "REACHED":
      return "reached";

    case "NEAR":
      return "near";

    case "APPROACHING":
      return "approaching";

    default:
      return "";
  }
}

function stateLabel(state){
  const s = String(state || "").toUpperCase();

  const labels = {
    REACHED:"🎯 وارد Zone",
    NEAR:"🟠 نزدیک Zone",
    APPROACHING:"🔵 در مسیر Zone",
    WAITING:"⏳ انتظار",
    INVALID:"❌ نامعتبر"
  };

  return labels[s] || s || "نامشخص";
}

function badgeClass(state){
  const s = String(state || "").toUpperCase();

  if(s === "REACHED") return "badge-reached";
  if(s === "NEAR") return "badge-near";
  if(s === "APPROACHING") return "badge-approaching";
  if(s === "INVALID") return "badge-invalid";

  return "badge-waiting";
}

function getSymbol(item){
  return String(
    item?.symbol ||
    item?.setup?.symbol ||
    ""
  ).toUpperCase();
}

/* =========================
   Alert logic
========================= */

function maybeAlert(symbol,state){
  const s =
    String(state || "").toUpperCase();

  if(
    !["REACHED","NEAR","APPROACHING"]
      .includes(s)
  ){
    return;
  }

  const key = symbol + ":" + s;

  if(alertedStates.has(key)){
    return;
  }

  alertedStates.add(key);

  if(soundEnabled){
    playAlert(s);
  }
}

/* =========================
   Health
========================= */

async function checkHealth(){
  const status =
    document.getElementById("status");

  try{
    const res =
      await fetch(
        WORKER + "/health",
        {cache:"no-store"}
      );

    if(!res.ok){
      throw new Error("HTTP " + res.status);
    }

    const data = await res.json();

    status.textContent =
      "🟢 Worker آنلاین — Bybit متصل است";

    return data;

  }catch(error){

    status.textContent =
      "🔴 اتصال به Worker برقرار نیست";

    return null;
  }
}

/* =========================
   Card HTML
========================= */

function createCard(item){

  const symbol =
    getSymbol(item);

  const setup =
    item.setup ||
    item;

  const state =
    String(
      setup.state ||
      item.state ||
      "WAITING"
    ).toUpperCase();

  const price =
    item.price ??
    setup.currentPrice ??
    item.currentPrice;

  const pumpPercent =
    setup.pumpPercent ??
    item.pumpPercent;

  const volumeMultiplier =
    setup.volumeMultiplier ??
    item.volumeMultiplier;

  const redCandle =
    setup.redCandle ||
    item.redCandle ||
    {};

  const pullback =
    setup.pullback ||
    item.pullback ||
    {};

  const zone =
    setup.zone ||
    item.zone ||
    {};

  const card =
    document.createElement("div");

  card.className =
    "coin-card " +
    stateClass(state);

  card.dataset.symbol = symbol;

  card.innerHTML = `
    <div class="coin-head">
      <div>
        <div class="coin-title">
          ${escapeHtml(symbol)}
        </div>

        <div class="small">
          Pump / Pullback / Retest
        </div>
      </div>

      <div class="price">
        ${num(price,8)}
      </div>

      <span class="badge ${badgeClass(state)}">
        ${escapeHtml(stateLabel(state))}
      </span>
    </div>

    <div class="grid">

      <div class="info">
        <span>درصد Pump</span>
        <b>${pct(pumpPercent)}</b>
      </div>

      <div class="info">
        <span>Volume Multiplier</span>
        <b>${num(volumeMultiplier,2)}x</b>
      </div>

      <div class="info">
        <span>Red Candle</span>
        <b>
          ${
            redCandle.found === true
              ? "YES"
              : redCandle.found === false
                ? "NO"
                : "-"
          }
        </b>
      </div>

      <div class="info">
        <span>Pullback</span>
        <b>${pct(
          pullback.percent ??
          setup.pullbackPercent
        )}</b>
      </div>

      <div class="info">
        <span>Zone</span>
        <b>${num(
          zone.price ??
          setup.zonePrice,
          8
        )}</b>
      </div>

      <div class="info">
        <span>فاصله از Zone</span>
        <b>${pct(
          setup.distanceToZonePercent ??
          setup.distancePercent
        )}</b>
      </div>

    </div>

    <div class="actions">

      <button
        class="btn-blue deepBtn"
        type="button">
        🔎 تحلیل عمیق
      </button>

      <button
        class="btn-red closeBtn"
        type="button">
        ✕ بستن
      </button>

    </div>

    <div class="deep hidden"></div>
  `;

  const deepBtn =
    card.querySelector(".deepBtn");

  const closeBtn =
    card.querySelector(".closeBtn");

  deepBtn.addEventListener(
    "click",
    () => openDeep(symbol, card)
  );

  closeBtn.addEventListener(
    "click",
    () => closeCoin(symbol)
  );

  return card;
}

/* =========================
   Update card
   بدون نابود کردن deep
========================= */

function updateCard(card,item){

  const setup =
    item.setup ||
    item;

  const state =
    String(
      setup.state ||
      item.state ||
      "WAITING"
    ).toUpperCase();

  const price =
    item.price ??
    setup.currentPrice ??
    item.currentPrice;

  const pumpPercent =
    setup.pumpPercent ??
    item.pumpPercent;

  const volumeMultiplier =
    setup.volumeMultiplier ??
    item.volumeMultiplier;

  const redCandle =
    setup.redCandle ||
    item.redCandle ||
    {};

  const pullback =
    setup.pullback ||
    item.pullback ||
    {};

  const zone =
    setup.zone ||
    item.zone ||
    {};

  card.className =
    "coin-card " +
    stateClass(state);

  const title =
    card.querySelector(".coin-title");

  if(title){
    title.textContent =
      getSymbol(item);
  }

  const priceEl =
    card.querySelector(".price");

  if(priceEl){
    priceEl.textContent =
      num(price,8);
  }

  const badge =
    card.querySelector(".badge");

  if(badge){
    badge.className =
      "badge " +
      badgeClass(state);

    badge.textContent =
      stateLabel(state);
  }

  const infos =
    card.querySelectorAll(".info b");

  if(infos.length >= 6){

    infos[0].textContent =
      pct(pumpPercent);

    infos[1].textContent =
      num(volumeMultiplier,2) + "x";

    infos[2].textContent =
      redCandle.found === true
        ? "YES"
        : redCandle.found === false
          ? "NO"
          : "-";

    infos[3].textContent =
      pct(
        pullback.percent ??
        setup.pullbackPercent
      );

    infos[4].textContent =
      num(
        zone.price ??
        setup.zonePrice,
        8
      );

    infos[5].textContent =
      pct(
        setup.distanceToZonePercent ??
        setup.distancePercent
      );
  }

  return state;
}

/* =========================
   Render Results
   مهم:
   کل results پاک نمی‌شود
========================= */

function renderResults(items){

  if(!Array.isArray(items)){
    return;
  }

  const results =
    document.getElementById("results");

  for(const item of items){

    const symbol =
      getSymbol(item);

    if(!symbol){
      continue;
    }

    /*
      اگر کاربر این ارز را بسته،
      اسکنر نباید دوباره کارت آن را باز کند.
    */
    if(closedCoins.has(symbol)){
      continue;
    }

    let card =
      cards.get(symbol);

    if(!card){

      card =
        createCard(item);

      cards.set(symbol,card);

      results.appendChild(card);

    }else{

      updateCard(card,item);
    }

    const setup =
      item.setup ||
      item;

    const state =
      String(
        setup.state ||
        item.state ||
        "WAITING"
      ).toUpperCase();

    maybeAlert(symbol,state);
  }

  const empty =
    document.getElementById("emptyState");

  if(empty){
    empty.remove();
  }

  updateStats();
}

/* =========================
   بستن یک ارز
========================= */

function closeCoin(symbol){

  symbol =
    String(symbol || "").toUpperCase();

  closedCoins.add(symbol);

  const card =
    cards.get(symbol);

  if(card){
    card.remove();
    cards.delete(symbol);
  }

  updateStats();
}

/* =========================
   باز کردن دوباره با تحلیل دستی
========================= */

function reopenManual(symbol){

  symbol =
    String(symbol || "").toUpperCase();

  closedCoins.delete(symbol);

  /*
    هشدارهای قبلی را پاک نمی‌کنیم
    تا با refreshهای معمولی اسپم ایجاد نشود.
  */
}

/* =========================
   Deep Analysis
========================= */

async function openDeep(symbol,card){

  reopenManual(symbol);

  const deep =
    card.querySelector(".deep");

  if(!deep){
    return;
  }

  deep.classList.remove("hidden");

  deep.innerHTML = `
    <div class="section">
      <div class="section-title">
        ⏳ دریافت تحلیل عمیق ${escapeHtml(symbol)}
      </div>
    </div>
  `;

  try{

    const res =
      await fetch(
        WORKER +
        "/analyze?symbol=" +
        encodeURIComponent(symbol),
        {cache:"no-store"}
      );

    if(!res.ok){
      throw new Error(
        "HTTP " + res.status
      );
    }

    const data =
      await res.json();

    deep.innerHTML =
      buildDeepHtml(data);

    startLive(symbol,card);

  }catch(error){

    deep.innerHTML = `
      <div class="section">
        <div class="section-title">
          ❌ خطا در تحلیل
        </div>

        <div style="padding:14px;color:#e98b8b">
          ${escapeHtml(error.message)}
        </div>
      </div>
    `;
  }
}

/* =========================
   Deep HTML
========================= */

function buildDeepHtml(data){

  const setup =
    data.setup ||
    data.pumpSetup ||
    {};

  const footprint =
    data.footprint ||
    {};

  const walls =
    data.orderbook ||
    data.walls ||
    {};

  const oi =
    data.openInterest ||
    data.oi ||
    {};

  const funding =
    data.funding ||
    {};

  const trades =
    data.recentTrades ||
    data.trades ||
    [];

  const price =
    data.price ??
    data.currentPrice ??
    setup.currentPrice;

  let html = `
    <div class="section">
      <div class="section-title">
        🎯 Setup
      </div>

      <div class="grid">

        <div class="info">
          <span>Symbol</span>

  /* Footprint */

  const fpRows =

  html += `
    <div class="section">

        📊 Footprint

      <div class="table-wrap">

              <th>Delta %</th>
              <th>Trades</th>

  for(const [tf,v] of fpRows){

    if(!v || typeof v !== "object"){

    html += `

        <td>${num(v.buyVolume)}</td>
        <td>${num(v.sellVolume)}</td>

          v.delta ??

  html += `

      </div>
    </div>
  `;

  /* Walls */

  const buyWalls =

      ? walls.sellWalls

  html += `
    <div class="section">

      <div class="table-wrap">

        <td>${num(w.notional)}</td>
        <td>${pct(w.distancePercent)}</td>

    html += `

        <td>SELL</td>

        <td>${num(w.size)}</td>
        <td>${num(w.notional)}</td>
        <td>${pct(w.distancePercent)}</td>
        <td>${num(w.strength,2)}</td>
      </tr>

  }

  html += `
          </tbody>
        </table>
      </div>
    </div>
  `;

  /* OI */

  const oiRows =
    Object.entries(oi || {});

  html += `
    <div class="section">
      <div class="section-title">
        📈 Open Interest
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>

              <th>Current</th>
              <th>Previous</th>
              <th>Change</th>
              <th>Change %</th>
              <th>Trend</th>
            </tr>

          <tbody>
  `;

  for(const [tf,v] of oiRows){

    html += `

        <td>${num(v.current)}</td>
        <td>${num(v.previous)}</td>
        <td>${num(v.change)}</td>
        <td>${pct(v.changePercent)}</td>

  }

  html += `
          </tbody>
        </table>
      </div>
    </div>
  `;

  /* Funding */

  html += `
    <div class="section">
      <div class="section-title">
        💰 Funding
      </div>

      <div class="grid">

        <div class="info">
          <span>Current</span>
          <b>${pct(
            funding.current
          )}</b>
        </div>

        <div class="info">
          <span>Previous</span>

            funding.previous

  /* Recent Trades */

  html += `
    <div class="section">
      <div class="section-title">
        🔄 Recent Trades
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>

              <th>Side</th>
              <th>Price</th>

  if(Array.isArray(trades)){

    for(const t of trades.slice(0,100)){

      html += `

            t.time ||

  html += `

      </div>

    <div class="live">

/* =========================
   Live
========================= */

const liveTimers = new Map();

function startLive(symbol,card){

  stopLive(symbol);

  const timer =
    setInterval(
      async () => {

        /*
          اگر کاربر کارت را بسته،
          polling هم باید متوقف شود.
        */
        if(
          closedCoins.has(symbol) ||
          !document.body.contains(card)
        ){
          stopLive(symbol);
          return;
        }

        await refreshLive(
          symbol,
          card
        );

      },
      LIVE_INTERVAL
    );

  liveTimers.set(symbol,timer);
}

function stopLive(symbol){

  const timer =
    liveTimers.get(symbol);

  if(timer){
    clearInterval(timer);
    liveTimers.delete(symbol);
  }
}

async function refreshLive(symbol,card){

  try{

    const res =
      await fetch(
        WORKER +
        "/live?symbol=" +
        encodeURIComponent(symbol),
        {cache:"no-store"}
      );

    if(!res.ok){
      return;
    }

    const data =
      await res.json();

    /*
      اگر Live پاسخ Setup جدید داشته باشد
      badge اصلی را نیز آپدیت می‌کنیم،
      بدون دست زدن به deep DOM.
    */

    const setup =
      data.setup ||
      data.pumpSetup ||
      data;

    const state =
      String(
        setup.state ||
        data.state ||
        "WAITING"
      ).toUpperCase();

    const price =
      data.price ??
      data.currentPrice ??
      setup.currentPrice;

    const priceEl =
      card.querySelector(".price");

    if(priceEl){
      priceEl.textContent =
        num(price,8);
    }

    const badge =
      card.querySelector(".badge");

    if(badge){

      badge.className =
        "badge " +
        badgeClass(state);

      badge.textContent =
        stateLabel(state);
    }

    card.className =
      "coin-card " +
      stateClass(state);

    maybeAlert(
      symbol,
      state
    );

  }catch(error){
    /* Live failure نباید کارت را حذف کند */
  }
}

/* =========================
   Stop همه Liveها
========================= */

function stopAllLive(){

  for(const symbol of liveTimers.keys()){
    stopLive(symbol);
  }
}

/* =========================
   Scan
========================= */

async function scan(){

  if(!scanning){
    return;
  }

  try{

    const res =
      await fetch(
        WORKER + "/scan",
        {cache:"no-store"}
      );

    if(!res.ok){
      throw new Error(
        "HTTP " + res.status
      );
    }

    const data =
      await res.json();

    const items =
      Array.isArray(data)
        ? data
        : (
          data.results ||
          data.items ||
          data.data ||
          []
        );

    renderResults(items);

  }catch(error){

    document.getElementById("status")
      .textContent =
      "🟡 خطا در دریافت اسکن — تلاش مجدد خودکار";

  }
}

function startScan(){

  if(scanning){
    return;
  }

  unlockAudio();

  scanning = true;

  document.getElementById("scanState")
    .textContent = "فعال";

  document.getElementById("status")
    .textContent =
      "🟢 اسکن خودکار فعال است";

  scan();

  scanTimer =
    setInterval(
      scan,
      SCAN_INTERVAL
    );
}

function stopScan(){

  scanning = false;

  if(scanTimer){
    clearInterval(scanTimer);
    scanTimer = null;
  }

  document.getElementById("scanState")
    .textContent = "خاموش";

  document.getElementById("status")
    .textContent =
      "⏹ اسکن متوقف شد";

  /*
    کارت‌ها عمداً باقی می‌مانند.
    فقط با ✕ بستن حذف می‌شوند.
  */
}

/* =========================
   Manual Analyze
========================= */

async function manualAnalyze(){

  const input =
    document.getElementById(
      "symbolInput"
    );

  const symbol =
    input.value
      .trim()
      .toUpperCase();

  if(!symbol){
    input.focus();
    return;
  }

  unlockAudio();

  /*
    اجازه می‌دهیم ارز بسته‌شده
    دوباره دستی باز شود.
  */
  closedCoins.delete(symbol);

  let card =
    cards.get(symbol);

  if(!card){

    card =
      createCard({
        symbol,
        state:"WAITING"
      });

    cards.set(symbol,card);

    document
      .getElementById("results")
      .appendChild(card);
  }

  const deep =
    card.querySelector(".deep");

  if(deep){
    deep.classList.remove("hidden");
  }

  await openDeep(
    symbol,
    card
  );

  updateStats();
}

/* =========================
   Stats
========================= */

function updateStats(){

  let reached = 0;
  let near = 0;

  for(const card of cards.values()){

    if(!document.body.contains(card)){
      continue;
    }

    const badge =
      card.querySelector(".badge");

    const text =
      badge?.textContent || "";

    if(text.includes("وارد")){
      reached++;
    }

    if(text.includes("نزدیک")){
      near++;
    }
  }

  document.getElementById(
    "resultCount"
  ).textContent =
    cards.size;

  document.getElementById(
    "reachedCount"
  ).textContent =
    reached;

  document.getElementById(
    "nearCount"
  ).textContent =
    near;
}

/* =========================
   Events
========================= */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startScan
  );

document
  .getElementById("stopBtn")
  .addEventListener(
    "click",
    stopScan
  );

document
  .getElementById("analyzeBtn")
  .addEventListener(
    "click",
    manualAnalyze
  );

document
  .getElementById("symbolInput")
  .addEventListener(
    "keydown",
    event => {
      if(event.key === "Enter"){
        manualAnalyze();
      }
    }
  );

/* =========================
   شروع
========================= */

checkHealth();

updateStats();

</script>
