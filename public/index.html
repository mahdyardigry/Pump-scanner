<body>

<div class="container">

  <div class="header">

    <h1>
      🚀 اسکنر هوشمند جهش قیمت بای‌بیت
    </h1>

    </p>

    <div id="status" class="status">
      ⏳ در حال اتصال به Worker...
    </div>

  </div>


  <div class="controls">

    <button
      id="startScan"

    >
      ▶️ شروع اسکن
    </button>

      disabled
    >
      ⏹️ توقف اسکن
    </button>

    <button
      id="testSound"
      class="test"
    >
      🔊 تست صدا
    </button>

  </div>


  <div class="search">

    <input
      id="symbolInput"
      type="text"
      placeholder="مثلاً BTCUSDT یا PEPE"
      autocomplete="off"
    >

    <button id="analyzeBtn">
      🔎 تحلیل عمیق
    </button>

  </div>


  <div class="sound-panel">

    <label>
      <input
        type="checkbox"
        id="soundEnabled"
      >
      🔊 هشدار صوتی
    </label>

    <label>
      میزان صدا:
      <input
        type="range"
        id="soundVolume"
        min="0"
        max="1"
        step="0.05"
        value="0.5"
      >
    </label>

  </div>


  <div class="stats">

    <div class="stat">
      <div class="stat-title">
        وضعیت اسکن
      </div>
      <div
        id="scanState"
        class="stat-value"
      >
        متوقف
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        تعداد نتایج
      </div>
      <div
        id="resultCount"
        class="stat-value"
      >
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        وارد ناحیه
      </div>
      <div
        id="reachedCount"
        class="stat-value buy"
      >
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">
        نزدیک ناحیه
      </div>
      <div
        id="nearCount"
        class="stat-value"
      >
        0
      </div>
    </div>

  </div>


  <div id="results">

    <div class="empty">
      برای شروع، اسکن را فعال کنید یا یک نماد را تحلیل کنید.
    </div>

  </div>

</div>


<script>

const WORKER =
  "https://pump-scanner.29mah12.workers.dev";

const LIVE_INTERVAL =
  3000;

const SCAN_INTERVAL =
  10000;

let scanning = false;

let scanTimer = null;

const cards =
  new Map();

const closedCoins =
  new Set();

const alertedStates =
  new Set();

const previousStates =
  new Map();

const liveTimers =
  new Map();

let audioContext = null;


/* =========================
   SOUND
========================= */

const soundEnabled =
  document.getElementById(
    "soundEnabled"
  );

const soundVolume =
  document.getElementById(
    "soundVolume"
  );


soundEnabled.checked =
  localStorage.getItem(
    "pump_sound_enabled"
  ) !== "false";


soundVolume.value =
  localStorage.getItem(
    "pump_sound_volume"
  ) || "0.5";


soundEnabled.addEventListener(
  "change",
  () => {

    localStorage.setItem(
      "pump_sound_enabled",
      String(
        soundEnabled.checked
      )
    );

  }
);


soundVolume.addEventListener(
  "input",
  () => {

    localStorage.setItem(
      "pump_sound_volume",
      soundVolume.value
    );

  }
);


function unlockAudio(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch{}

}


function beep(
  frequency = 700,
  duration = 140,
  delay = 0
){

  if(
    !soundEnabled.checked
  ){
    return;
  }

  setTimeout(
    () => {

      try{

        unlockAudio();

        const osc =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        osc.type =
          "sine";

        osc.frequency.value =
          frequency;

        gain.gain.setValueAtTime(
          0,
          audioContext.currentTime
        );

        gain.gain.linearRampToValueAtTime(
          Number(
            soundVolume.value
          ) * 0.22,
          audioContext.currentTime +
            0.01
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime +
            duration / 1000
        );

        osc.connect(gain);

        gain.connect(
          audioContext.destination
        );

        osc.start();

        osc.stop(
          audioContext.currentTime +
            duration / 1000 +
            0.02
        );

      }catch{}

    },
    delay
  );

}


function playAlert(state){

  if(state === "REACHED"){

    beep(900,160,0);
    beep(1100,160,210);
    beep(1300,190,420);

  }
  else if(state === "NEAR"){

    beep(760,150,0);
    beep(950,170,210);

  }
  else if(state === "APPROACHING"){

    beep(650,150,0);

  }

}


document.addEventListener(
  "pointerdown",
  unlockAudio,
  { once:true }
);


document.getElementById(
  "testSound"
).addEventListener(
  "click",
  () => {

    unlockAudio();

    beep(700,140,0);
    beep(900,160,210);
    beep(1100,180,420);

  }
);


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function num(
  value,
  fallback = 0
){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;

}


function pct(
  value,
  digits = 2
){

  return num(value).toFixed(
    digits
  ) + "%";

}


function valueClass(
  value
){

  const n =
    num(value);

  if(n > 0){
    return "positive";
  }

  if(n < 0){
    return "negative";
  }

  return "neutral";

}


function deltaPercentClass(
  value
){

  return valueClass(value);

}


function formatNumber(
  value,
  digits = 4
){

  const n =
    Number(value);

  if(
    !Number.isFinite(n)
  ){
    return "0";
  }

  return n.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:
        digits
    }
  );

}


function formatPrice(
  value
){

  const n =
    Number(value);

  if(
    !Number.isFinite(n)
  ){
    return "0";
  }

  if(n >= 1000){
    return n.toLocaleString(
      "en-US",
      {
        maximumFractionDigits:2
      }
    );
  }

  if(n >= 1){
    return n.toLocaleString(
      "en-US",
      {
        maximumFractionDigits:6
      }
    );
  }

  return n.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:12
    }
  );

}


function formatTradeTime(
  timestamp
){

  let t =
    Number(timestamp);

  if(
    !Number.isFinite(t) ||
    t <= 0
  ){
    return "--";
  }

  if(
    t < 100000000000
  ){
    t *= 1000;
  }

  const d =
    new Date(t);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return "--";
  }

  return [
    String(
      d.getHours()
    ).padStart(2,"0"),

    String(
      d.getMinutes()
    ).padStart(2,"0"),

    String(
      d.getSeconds()
    ).padStart(2,"0")
  ].join(":");

}


function getSymbol(
  item
){

  return String(
    item?.symbol ||
    ""
  ).toUpperCase();

}


function stateClass(
  state
){

  return String(
    state || ""
  ).toLowerCase();

}


function stateLabel(
  state
){

  switch(state){

    case "REACHED":
      return "وارد ناحیه ورود شده";

    case "NEAR":
      return "نزدیک ناحیه ورود";

    case "APPROACHING":
      return "در مسیر ناحیه ورود";

    case "WAITING":
    case "WAITING_RED":
      return "در انتظار شکل‌گیری شرایط";

    case "INVALID":
      return "شرایط نامعتبر شده";

    default:
      return state || "نامشخص";

  }

}


function badgeClass(
  state
){

  if(
    state === "REACHED"
  ){
    return "badge-reached";
  }

  if(
    state === "NEAR"
  ){
    return "badge-near";
  }

  if(
    state === "APPROACHING"
  ){
    return "badge-approaching";
  }

  if(
    state === "INVALID"
  ){
    return "badge-invalid";
  }

  return "badge-waiting";

}


function normalizeItem(
  item
){

  const pump =
    item?.pump || {};

  const setup =
    item?.setup || {};

  const state =
    String(
      item?.state ||
      setup?.state ||
      item?.currentState?.state ||
      "WAITING"
    ).toUpperCase();

  return {

    ...item,

    symbol:
      getSymbol(item),

    category:
      item?.category || "",

    price:
      num(
        item?.price ??
        item?.ticker?.lastPrice ??
        item?.currentPrice ??
        setup?.price
      ),

    pumpPercent:
      num(
        pump?.pumpPercent ??
        setup?.pumpPercent
      ),

    volumeMultiplier:
      num(
        pump?.volumeMultiplier ??
        pump?.volumeRatio ??
        setup?.volumeMultiplier
      ),

    redCandle:
      setup?.redCandle || null,

    pullbackPercent:
      num(
        setup?.pullbackPercent
      ),

    zoneLow:
      num(
        setup?.zoneLow
      ),

    zoneHigh:
      num(
        setup?.zoneHigh
      ),

    zonePrice:
      num(
        setup?.zonePrice
      ),

    distancePercent:
      num(
        setup?.distancePercent ??
        item?.distancePercent ??
        item?.currentState?.distancePercent
      ),

    score:
      num(
        pump?.score
      ),

    state

  };

}


/* =========================
   ALERT
========================= */

function maybeAlert(
  symbol,
  state
){

  if(
    ![
      "REACHED",
      "NEAR",
      "APPROACHING"
    ].includes(state)
  ){
    return;
  }

  const previous =
    previousStates.get(
      symbol
    );

  previousStates.set(
    symbol,
    state
  );

  if(
    previous === state
  ){
    return;
  }

  const key =
    symbol + ":" + state;

  if(
    alertedStates.has(key)
  ){
    return;
  }

  alertedStates.add(key);

  playAlert(state);

}


/* =========================
   HEALTH
========================= */

async function checkHealth(){

  const status =
    document.getElementById(
      "status"
    );

  try{

    const res =
      await fetch(
        WORKER + "/health",
        {
          cache:"no-store"
        }
      );

    if(!res.ok){
      throw new Error(
        "HTTP " + res.status
      );
    }

    const data =
      await res.json();

    if(!data.ok){
      throw new Error(
        "Worker error"
      );
    }

    status.textContent =
      "🟢 اتصال برقرار است — Bybit";

  }catch(error){

    status.textContent =
      "🔴 اتصال به Worker برقرار نیست";

  }

}


/* =========================
   CARD
========================= */

function createCard(
  item
){

  const data =
    normalizeItem(item);

  const card =
    document.createElement(
      "div"
    );

function updateCard(
  card,
  item
){

  const data =
    normalizeItem(item);

  card.className =
    "coin-card " +
    stateClass(
      data.state
    );

  const price =
    card.querySelector(
      '[data-field="price"]'
    );

  const state =
    card.querySelector(
      '[data-field="state"]'
    );

  if(price){
    price.textContent =
      formatPrice(
        data.price
      );
  }

  if(state){

    state.className =
      "badge " +
      badgeClass(
        data.state
      );

    state.textContent =
      stateLabel(
        data.state
      );

  }

  const pump =
    card.querySelector(
      '[data-field="pumpPercent"]'
    );

  if(pump){

    pump.textContent =
      pct(
        data.pumpPercent
      );

  }

  const vm =
    card.querySelector(
      '[data-field="volumeMultiplier"]'
    );

  if(vm){

    vm.textContent =
      formatNumber(
        data.volumeMultiplier,
        2
      ) + "x";

  }

  const red =
    card.querySelector(
      '[data-field="redCandle"]'
    );

  if(red){

    red.textContent =
      data.redCandle
        ? "تشکیل شده"
        : "در انتظار";

  }

  const pb =
    card.querySelector(
      '[data-field="pullbackPercent"]'
    );

  if(pb){

    pb.textContent =
      pct(
        data.pullbackPercent
      );

  }

  const zone =
    card.querySelector(
      '[data-field="zone"]'
    );

  if(zone){

    zone.textContent =
      formatPrice(
        data.zoneLow
      ) +
      " تا " +

  }

  const dist =

  if(dist){

}


/* =========================
   RESULTS
========================= */

function renderResults(
  items
){

  if(
    !Array.isArray(items)
  ){
    return;
  }

  const results =
    document.getElementById(
      "results"
    );

  const validSymbols =
    new Set();


  for(
    const raw of items
  ){

    const item =
      normalizeItem(raw);

    if(
      !item.symbol
    ){
      continue;
    }

    if(
      closedCoins.has(
        item.symbol
      )
    ){
      continue;
    }

    validSymbols.add(
      item.symbol
    );

    let card =
      cards.get(
        item.symbol
      );

    if(!card){

      card =
        createCard(item);

      cards.set(
        item.symbol,
        card
      );

      results.appendChild(
        card
      );

    }else{

      updateCard(
        card,
        item
      );

    }

    maybeAlert(
      item.symbol,
      item.state
    );

  }


  const empty =
    results.querySelector(
      ".empty"
    );

  if(
    empty &&
    cards.size > 0
  ){
    empty.remove();
  }


  updateStats();

}


/* =========================
   CLOSE
========================= */

function closeCoin(
  symbol
){

  closedCoins.add(
    symbol
  );

  stopLive(
    symbol
  );

  const card =
    cards.get(
      symbol
    );

  if(card){
    card.remove();
  }

  cards.delete(
    symbol
  );

  updateStats();

}


/* =========================
   MANUAL REOPEN
========================= */

function reopenManual(
  symbol
){

  closedCoins.delete(
    symbol
  );

}


/* =========================
   DEEP ANALYSIS
========================= */

async function openDeep(
  symbol,
  card
){

  reopenManual(
    symbol
  );

  const deep =
    card.querySelector(
      '[data-field="deep"]'
    );

  deep.hidden =
    false;

  deep.innerHTML = `

    <div class="empty">
      ⏳ در حال دریافت داده‌های واقعی Bybit...
    </div>

  `;


  try{

    const res =
      await fetch(
        WORKER +
        "/analyze?symbol=" +
        encodeURIComponent(
          symbol
        ),
        {
          cache:"no-store"
        }
      );

    if(!res.ok){

      throw new Error(
        "HTTP " + res.status
      );

    }

    const data =
      await res.json();

    if(!data.ok){

      throw new Error(
        data.error ||
        "Analysis failed"
      );

    }

    updateCard(
      card,
      data
    );

    deep.innerHTML =
      buildDeepHtml(
        data
      );

    startLive(
      symbol,
      card
    );

  }catch(error){

    deep.innerHTML = `

      <div class="section">

        <h3>
          ❌ خطا در تحلیل
        </h3>

        <div class="negative">
          ${escapeHtml(
            error.message
          )}
        </div>

      </div>

    `;

  }

}

/* =========================================================
   TIME
========================================================= */

function timeToSeconds(
  value
){

  if(
    !value
  ){
    return null;
  }

  const parts =
    String(value)
      .split(":")
      .map(Number);

  if(
    parts.some(
      x => !Number.isFinite(x)
    )
  ){
    return null;
  }

  if(
    parts.length === 2
  ){

    return (
      parts[0] * 3600 +
      parts[1] * 60
    );

  }

  if(
    parts.length === 3
  ){

    return (
      parts[0] * 3600 +
      parts[1] * 60 +
      parts[2]
    );

  }

  return null;

}


function getTradeTimestamp(
  trade
){

  let ts =
    Number(
      trade?.time ??
      trade?.timestamp
    );

  if(
    !Number.isFinite(ts)
  ){
    return 0;
  }

  if(
    ts < 100000000000
  ){
    ts *= 1000;
  }

  return ts;

}


function getTradeTimeSeconds(
  trade
){

  const ts =
    getTradeTimestamp(
      trade
    );

  if(
    !ts
  ){
    return null;
  }

  const d =
    new Date(ts);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return null;
  }

  return (
    d.getHours() * 3600 +
    d.getMinutes() * 60 +
    d.getSeconds()
  );

}


/* =========================================================
   FILTER TRADES
========================================================= */

function filterTrades(
  trades,
  filters
){

  const from =
    timeToSeconds(
      filters.from
    );

  const to =
    timeToSeconds(
      filters.to
    );

  const minPrice =
    filters.minPrice !== "" &&
    filters.minPrice !== undefined
      ? Number(
          filters.minPrice
        )
      : null;

  const maxPrice =
    filters.maxPrice !== "" &&
    filters.maxPrice !== undefined
      ? Number(
          filters.maxPrice
        )
      : null;


  return trades.filter(
    trade => {

      const price =
        num(
          trade.price
        );

      if(
        minPrice !== null &&
        Number.isFinite(minPrice) &&
        price < minPrice
      ){
        return false;
      }

      if(
        maxPrice !== null &&
        Number.isFinite(maxPrice) &&
        price > maxPrice
      ){
        return false;
      }


      if(
        from !== null ||
        to !== null
      ){

        const seconds =
          getTradeTimeSeconds(
            trade
          );

        if(
          seconds === null
        ){
          return false;
        }


        if(
          from !== null &&
          to !== null
        ){

          if(
            from <= to
          ){

            if(
              seconds < from ||
              seconds > to
            ){
              return false;
            }

          }else{

            /*
              بازه عبوری از نیمه‌شب
              مثال:
              23:00 تا 02:00
            */

            if(
              seconds > to &&
              seconds < from
            ){
              return false;
            }

          }

        }else if(
          from !== null
        ){

          if(
            seconds < from
          ){
            return false;
          }

        }else if(
          to !== null
        ){

          if(
            seconds > to
          ){
            return false;
          }

        }

      }

      return true;

    }
  );

}


/* =========================================================
   AGGREGATE TRADES BY PRICE
========================================================= */

function aggregateTradesByPrice(
  trades
){

  const map =
    new Map();


  for(
    const trade
    of trades
  ){

    const price =
      num(
        trade.price
      );

    const size =
      num(
        trade.size ??
        trade.qty
      );

    if(
      price <= 0 ||
      size <= 0
    ){
      continue;
    }


    /*
      مقدار هر معامله همیشه:
      قیمت × حجم
    */

    const notional =
      price * size;


    /*
      استفاده از String قیمت
      برای نگه داشتن قیمت دقیق دریافتی
    */

    const key =
      String(
        trade.price
      );


    if(
      !map.has(key)
    ){

      map.set(
        key,
        {
          price,

          buyCount:0,
          buyVolume:0,
          buyNotional:0,

          sellCount:0,
          sellVolume:0,
          sellNotional:0
        }
      );

    }


    const row =
      map.get(key);


    const side =
      String(
        trade.side ||
        ""
      ).toLowerCase();


    if(
      side === "buy"
    ){

      row.buyCount++;

      row.buyVolume +=
        size;

      row.buyNotional +=
        notional;

    }else{

      row.sellCount++;

      row.sellVolume +=
        size;

      row.sellNotional +=
        notional;

    }

  }


  return Array.from(
    map.values()
  )
  .map(
    row => ({

      ...row,

      deltaVolume:
        row.buyVolume -
        row.sellVolume,

      deltaNotional:
        row.buyNotional -
        row.sellNotional

    })
  )
  .sort(
    (a,b) =>
      b.price -
      a.price
  );

}

/* =========================================================
   ORDERBOOK AGGREGATION
========================================================= */

function aggregateOrderbook(
  orderbook
){

  const map =
    new Map();


  function add(
    price,
    size,
    side
  ){

    price =
      num(price);

    size =
      num(size);


    if(
      price <= 0 ||
      size <= 0
    ){
      return;
    }


    const key =
      String(
        price
      );


    if(
      !map.has(key)
    ){

      map.set(
        key,
        {

          price,

          buyCount:0,
          buyVolume:0,
          buyNotional:0,

          sellCount:0,
          sellVolume:0,
          sellNotional:0

        }
      );

    }


    const row =
      map.get(key);


    const notional =
      price * size;


    if(
      side === "BUY"
    ){

      row.buyCount++;

      row.buyVolume +=
        size;

      row.buyNotional +=
        notional;

    }else{

      row.sellCount++;

      row.sellVolume +=
        size;

      row.sellNotional +=
        notional;

    }

  }


  for(
    const level
    of orderbook?.bids || []
  ){

    add(
      level.price ??
      level[0],

      level.size ??
      level[1],

      "BUY"
    );

  }


  for(
    const level
    of orderbook?.asks || []
  ){

    add(
      level.price ??
      level[0],

      level.size ??
      level[1],

      "SELL"
    );

  }


  return Array.from(
    map.values()
  )
  .map(
    row => {

      const totalBuyCount =
        row.buyCount;

      const totalSellCount =
        row.sellCount;


      const averageBuyVolume =
        totalBuyCount > 0
          ? row.buyVolume /
            totalBuyCount
          : 0;


      const averageSellVolume =
        totalSellCount > 0
          ? row.sellVolume /
            totalSellCount
          : 0;


      const averageBuyNotional =
        totalBuyCount > 0
          ? row.buyNotional /
            totalBuyCount
          : 0;


      const averageSellNotional =
        totalSellCount > 0
          ? row.sellNotional /
            totalSellCount
          : 0;


      return {

        ...row,

        averageBuyVolume,

        averageSellVolume,

        averageBuyNotional,

        averageSellNotional,

        deltaVolume:
          row.buyVolume -
          row.sellVolume,

        deltaNotional:
          row.buyNotional -
          row.sellNotional

      };

    }
  )
  .sort(
    (a,b) =>
      b.price -
      a.price
  );

}

        </td>

        <td class="buy-data">
          ${formatNumber(
            row.buyNotional,
            2
          )}
        </td>

        <td class="sell-data">
          ${formatNumber(
            row.sellCount,
            0
          )}
        </td>

        <td class="sell-data">
          ${formatNumber(
            row.sellVolume,
            8
          )}
        </td>

        <td class="sell-data">
          ${formatNumber(
            row.averageSellVolume,
            8
          )}
        </td>

        <td class="sell-data">
          ${formatNumber(
            row.sellNotional,
            2
          )}
        </td>

        <td
          class="${valueClass(
            row.deltaVolume
          )}"
        >
          ${formatNumber(
            row.deltaVolume,
            8
          )}
        </td>

      </tr>

    `;

  }


  if(
    !rows.length
  ){

    html += `

      <tr>

        <td colspan="10">

          اطلاعات Orderbook دریافت نشده است.

        </td>

      </tr>

    `;

  }


  html += `

          </tbody>

  `;


  if(
    rows.length
  ){

    let buyCount = 0;
    let buyVolume = 0;
    let buyNotional = 0;

    let sellCount = 0;
    let sellVolume = 0;
    let sellNotional = 0;


    for(
      const row
      of rows
    ){

      buyCount +=
        row.buyCount;

      buyVolume +=
        row.buyVolume;

      buyNotional +=
        row.buyNotional;

      sellCount +=
        row.sellCount;

      sellVolume +=
        row.sellVolume;

      sellNotional +=
        row.sellNotional;

    }


    html += `

      <tfoot>

        <tr class="total-row">

          <td>
            جمع
          </td>

          <td class="buy-data">
            ${formatNumber(
              buyCount,
              0
            )}
          </td>

          <td class="buy-data">
            ${formatNumber(
              buyVolume,
              8
            )}
          </td>

          <td class="buy-data">
            ${
              buyCount > 0
                ? formatNumber(
                    buyVolume /
                    buyCount,
                    8
                  )
                : "0"
            }
          </td>

          <td class="buy-data">
            ${formatNumber(
              buyNotional,
              2
            )}
          </td>

          <td class="sell-data">
            ${formatNumber(
              sellCount,
              0
            )}
          </td>

          <td class="sell-data">
            ${formatNumber(
              sellVolume,
              8
            )}
          </td>

          <td class="sell-data">
            ${
              sellCount > 0
                ? formatNumber(
                    sellVolume /
                    sellCount,
                    8
                  )
                : "0"
            }
          </td>

          <td class="sell-data">
            ${formatNumber(
              sellNotional,
              2
            )}
          </td>

          <td class="${valueClass(
            buyVolume -
            sellVolume
          )}">
            ${formatNumber(
              buyVolume -
              sellVolume,
              8
            )}
          </td>

        </tr>

      </tfoot>

    `;

  }


  html += `

        </table>

      </div>

    </div>

  `;


  return html;

}


/* =========================
   LIVE
========================= */

function startLive(
  symbol,
  card
){

  stopLive(
    symbol
  );


  const timer =
    setInterval(
      async () => {

        if(
          closedCoins.has(
            symbol
          )
        ){

          stopLive(
            symbol
          );

          return;

        }


        if(
          !document.body.contains(
            card
          )
        ){

          stopLive(
            symbol
          );

          return;

        }


        await refreshLive(
          symbol,
          card
        );

      },
      LIVE_INTERVAL
    );


  liveTimers.set(
    symbol,
    timer
  );

}


function stopLive(
  symbol
){

  const timer =
    liveTimers.get(
      symbol
    );

  if(timer){

    clearInterval(
      timer
    );

  }

  liveTimers.delete(
    symbol
  );

}


async function refreshLive(
  symbol,
  card
){

  try{

    const res =
      await fetch(
        WORKER +
        "/live?symbol=" +
        encodeURIComponent(
          symbol
        ),
        {
          cache:"no-store"
        }
      );


    if(!res.ok){
      return;
    }


    const data =
      await res.json();


    if(
      !data.ok
    ){
      return;
    }


    updateCard(
      card,
      data
    );


    maybeAlert(
      symbol,
      data.state
    );


    updateStats();


    /*
      تحلیل عمیق باز است.
      در هر بروزرسانی زنده، جدول‌های
      معاملات و Orderbook نیز تازه می‌شوند.
    */

    const deep =
      card.querySelector(
        '[data-field="deep"]'
      );


    if(
      deep &&
      !deep.hidden
    ){

      const scroll =
        deep.scrollTop;

      deep.innerHTML =
        buildDeepHtml(
          data
        );

      deep.scrollTop =
        scroll;

    }

  }catch{}

}


/* =========================
   SCAN
========================= */

async function runScan(){

  if(
    !scanning
  ){
    return;
  }


  const scanState =
    document.getElementById(
      "scanState"
    );

  scanState.textContent =
    "در حال اسکن";


  try{

    const res =
      await fetch(
        WORKER + "/scan",
        {
          cache:"no-store"
        }
      );


    if(!res.ok){

      throw new Error(
        "HTTP " +
        res.status
      );

    }


    const data =
      await res.json();


    const items =
      Array.isArray(data)
        ? data
        : (
            data.results ||
            data.items ||
            data.data ||
            []
          );


    renderResults(
      items
    );


    scanState.textContent =
      scanning
        ? "فعال"
        : "متوقف";


  }catch(error){

    scanState.textContent =
      "خطا";

  }

}


function startScan(){

  if(
    scanning
  ){
    return;
  }


  unlockAudio();


  scanning = true;


  document.getElementById(
    "startScan"
  ).disabled =
    true;


  document.getElementById(
    "stopScan"
  ).disabled =
    false;


  document.getElementById(
    "scanState"
  ).textContent =
    "فعال";


  runScan();


  scanTimer =
    setInterval(
      runScan,
      SCAN_INTERVAL
    );

}


function stopScan(){

  scanning =
    false;


  if(
    scanTimer
  ){

    clearInterval(
      scanTimer
    );

    scanTimer =
      null;

  }


  document.getElementById(
    "startScan"
  ).disabled =
    false;


  document.getElementById(
    "stopScan"
  ).disabled =
    true;


  document.getElementById(
    "scanState"
  ).textContent =
    "متوقف";

}


/* =========================
   MANUAL ANALYSIS
========================= */

async function manualAnalyze(){

  let symbol =
    document.getElementById(
      "symbolInput"
    ).value
      .trim()
      .toUpperCase();


  if(!symbol){
    return;
  }


  if(
    !symbol.endsWith(
      "USDT"
    )
  ){

    symbol +=
      "USDT";

  }


  closedCoins.delete(
    symbol
  );


  let card =
    cards.get(
      symbol
    );


  if(!card){

    card =
      createCard({

        symbol,

        category:
          "در حال شناسایی",

        price:0,

        pump:{
          pumpPercent:0,
          volumeMultiplier:0,
          score:0
        },

        setup:{
          pullbackPercent:0,
          zoneLow:0,
          zoneHigh:0,
          zonePrice:0,
          state:"WAITING"
        },

        state:"WAITING"

      });


    cards.set(
      symbol,
      card
    );


    const results =
      document.getElementById(
        "results"
      );


    const empty =
      results.querySelector(
        ".empty"
      );


    if(empty){
      empty.remove();
    }


    results.prepend(
      card
    );

  }


  await openDeep(
    symbol,
    card
  );


  updateStats();

}


/* =========================
   STATS
========================= */

function updateStats(){

  document.getElementById(
    "resultCount"
  ).textContent =
    cards.size;


  let reached = 0;
  let near = 0;


  for(
    const card
    of cards.values()
  ){

    const badge =
      card.querySelector(
        '[data-field="state"]'
      );


    const text =
      badge?.textContent ||
      "";


    if(
      text.includes(
        "وارد ناحیه"
      )
    ){

      reached++;

    }


    if(
      text.includes(
        "نزدیک ناحیه"
      )
    ){

      near++;

    }

  }


  document.getElementById(
    "reachedCount"
  ).textContent =
    reached;


  document.getElementById(
    "nearCount"
  ).textContent =
    near;

}


/* =========================
   EVENTS
========================= */

document.getElementById(
  "startScan"
).addEventListener(
  "click",
  startScan
);


document.getElementById(
  "stopScan"
).addEventListener(
  "click",
  stopScan
);


document.getElementById(
  "analyzeBtn"
).addEventListener(
  "click",
  manualAnalyze
);


document.getElementById(
  "symbolInput"
).addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      manualAnalyze();

    }

  }
);


/* =========================
   INIT
========================= */

updateStats();

checkHealth();

</script>
