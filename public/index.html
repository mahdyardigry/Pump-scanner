<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pump Scanner Bybit V9</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#071018;
  color:#e8f0f7;
  font-family:
    Tahoma,
    Arial,
    sans-serif;
}

button,
input{
  font-family:inherit;
}

.container{
  width:min(1400px,96%);
  margin:auto;
}

header{
  margin:18px 0;
  padding:22px;
  border:1px solid #1c3443;
  border-radius:18px;
  background:#0b1721;
}

h1{
  margin:0 0 8px;
  font-size:25px;
}

.subtitle{
  color:#8fa8b8;
  line-height:1.8;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

button{
  border:1px solid #284454;
  background:#102331;
  color:#fff;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
}

button:hover{
  background:#173344;
}

button.danger{
  background:#35171d;
  border-color:#74333d;
}

button.primary{
  background:#123c35;
  border-color:#1d765f;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#09151e;
  border:1px solid #1d3442;
  color:#9fb6c5;
}

.stats{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin:15px 0;
}

.stat{
  padding:16px;
  background:#0b1721;
  border:1px solid #1b3443;
  border-radius:14px;
}

.stat b{
  display:block;
  font-size:21px;
  margin-top:7px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(330px,1fr));
  gap:14px;
}

.coin{
  position:relative;
  background:#0b1721;
  border:1px solid #1b3443;
  border-radius:16px;
  overflow:hidden;
}

.coin-head{
  padding:15px;
  border-bottom:1px solid #1a303e;
}

.coin-title{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.symbol{
  font-size:21px;
  font-weight:bold;
}

.market{
  font-size:12px;
  color:#7f9bad;
}

.state{
  padding:6px 9px;
  border-radius:8px;
  font-size:12px;
  background:#132530;
}

.state.reached{
  background:#123f30;
  color:#6ff0ba;
}

.state.near{
  background:#3b3312;
  color:#ffe27b;
}

.state.approaching{
  background:#243649;
  color:#9dc9ff;
}

.state.invalid{
  background:#3b171d;
  color:#ff8d9a;
}

.state.waiting{
  background:#2c2733;
  color:#d5b9ed;
}

.metrics{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);
  gap:8px;
  padding:13px;
}

.metric{
  background:#09151e;
  padding:10px;
  border-radius:9px;
}

.metric span{
  display:block;
  color:#7992a1;
  font-size:11px;
  margin-bottom:5px;
}

.metric b{
  font-size:14px;
}

.reason{
  margin:0 13px 13px;
  padding:10px;
  border-radius:9px;
  background:#111d27;
  color:#b6c7d2;
  font-size:13px;
}

.actions{
  display:flex;
  gap:8px;
  padding:0 13px 13px;
}

.actions button{
  flex:1;
}

.deep{
  display:none;
  padding:13px;
  border-top:1px solid #1b3443;
  background:#071119;
}

.deep.open{
  display:block;
}

.section{
  margin-top:14px;
}

.section:first-child{
  margin-top:0;
}

.section-title{
  font-weight:bold;
  margin-bottom:8px;
  color:#d8e7ef;
}

.table-wrap{
  overflow:auto;
  border:1px solid #1b3443;
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:620px;
}

th,
td{
  padding:9px 8px;
  border-bottom:1px solid #172b38;
  text-align:center;
  font-size:12px;
  white-space:nowrap;
}

th{
  background:#0d1d28;
  color:#9db4c2;
}

td{
  color:#d7e2e8;
}

.up{
  color:#5de3a3 !important;
}

.down{
  color:#ff7785 !important;
}

.flat{
  color:#a9bac4 !important;
}

.buy{
  color:#5de3a3 !important;
}

.sell{
  color:#ff7785 !important;
}

.neutral{
  color:#b4c2ca !important;
}

.live-box{
  background:#09151e;
  border:1px solid #1b3443;
  border-radius:10px;
  padding:11px;
  line-height:1.9;
}

.live-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid #152934;
  padding:6px 0;
}

.live-row:last-child{
  border-bottom:0;
}

.small{
  font-size:11px;
  color:#7992a1;
}

.coverage{
  color:#8299a7;
  font-size:10px;
}

.empty{
  padding:25px;
  text-align:center;
  color:#78909e;
  border:1px dashed #25404f;
  border-radius:12px;
}

.search{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.search input{
  flex:1;
  min-width:0;
  background:#07131c;
  color:#fff;
  border:1px solid #284454;
  border-radius:10px;
  padding:12px;
  outline:none;
}

footer{
  padding:30px 0;
  text-align:center;
  color:#607986;
  font-size:12px;
}

</style>
</head>

<body>

<div class="container">

<header>

<h1>🚀 Pump Scanner Bybit V9</h1>

<div class="subtitle">
تشخیص Pump واقعی روی تایم‌فریم ۱۵ دقیقه،
سپس Red Candle → Pullback Zone → Retest
با داده زنده Bybit
</div>

<div class="search">
<input
  id="symbolInput"
  placeholder="مثلاً BTCUSDT یا PEPE"
/>
<button
  class="primary"
  onclick="deepSearch()"
>
🔎 تحلیل عمیق
</button>
</div>

<div class="toolbar">

<button
  class="primary"
  onclick="startScan()"
>
▶ شروع اسکن
</button>

<button
  class="danger"
  onclick="stopScan()"
>
■ توقف
</button>

<button
  onclick="testSound()"
>
🔊 تست صدا
</button>

<button
  onclick="health()"
>
❤️ Health
</button>

</div>

<div
  id="status"
  class="status"
>
⏳ در حال اتصال...
</div>

</header>

<div
  id="stats"
  class="stats"
></div>

<div
  id="results"
  class="grid"
>
<div class="empty">
هنوز اسکن انجام نشده است.
</div>
</div>

<footer>
Pump Scanner V9 · Bybit Live Market Data
</footer>

</div>

<script>

const WORKER =
  "https://pump-scanner.29mah12.workers.dev";

let scanTimer = null;

const openLive = new Set();

const $ = id =>
  document.getElementById(id);

/* =========================
   FORMAT
========================= */

function n(v,d=4){

  const x = Number(v);

  if(!Number.isFinite(x))
    return "—";

  return x.toLocaleString(
    "en-US",
    {
      maximumFractionDigits:d
    }
  );
}

function percent(v){

  const x = Number(v);

  if(!Number.isFinite(x))
    return "—";

  return (
    x >= 0 ? "+" : ""
  ) +
  x.toFixed(2) +
  "%";
}

function time(ts){

  if(!ts)
    return "—";

  return new Date(ts)
    .toLocaleString(
      "fa-IR",
      {
        hour12:false
      }
    );
}

function duration(ms){

  if(!ms)
    return "—";

  if(ms < 1000)
    return ms + " ms";

  return (
    ms / 1000
  ).toFixed(1) + " s";
}

function cls(v){

  if(v > 0) return "up";

  if(v < 0) return "down";

  return "flat";
}

function pressure(v){

  if(v === "BUY_PRESSURE")
    return `<span class="buy">خرید قوی</span>`;

  if(v === "SELL_PRESSURE")
    return `<span class="sell">فروش قوی</span>`;

  return `<span class="neutral">خنثی</span>`;
}

function stateFa(v){

  const map = {
    REACHED:"رسیده به Zone",
    NEAR:"نزدیک Zone",
    APPROACHING:"در حال نزدیک شدن",
    INVALID:"نامعتبر",
    WAITING:"انتظار Red Candle"
  };

  return map[v] || v || "—";
}

/* =========================
   SOUND
========================= */

function testSound(){

  try{

    const C =
      window.AudioContext ||
      window.webkitAudioContext;

    const ctx =
      new C();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.frequency.value =
      720;

    gain.gain.value =
      0.05;

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    setTimeout(
      () => osc.stop(),
      180
    );

  }catch(e){}

}

/* =========================
   HEALTH
========================= */

async function health(){

  try{

    const res =
      await fetch(
        WORKER +
        "/health?t=" +
        Date.now()
      );

    const data =
      await res.json();

    $("status").innerHTML =
      "🟢 Worker آنلاین — " +
      data.version;

  }catch(e){

    $("status").innerHTML =
      "🔴 اتصال به Worker برقرار نیست";

  }

}

/* =========================
   SCAN
========================= */

async function startScan(){

  stopScan();

  $("status").innerHTML =
    "⏳ اسکن بازار شروع شد...";

  await runScan();

  scanTimer =
    setInterval(
      runScan,
      45000
    );

}

function stopScan(){

  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer =
      null;

  }

  $("status").innerHTML =
    "⏹ اسکن متوقف شد";

}

async function runScan(){

  const started =
    Date.now();

  try{

    $("status").innerHTML =
      "🔎 در حال اسکن Bybit...";

    const res =
      await fetch(
        WORKER +
        "/scan?t=" +
        Date.now()
      );

    const data =
      await res.json();

    if(!data.ok)
      throw new Error(
        data.error ||
        "Scan failed"
      );

    renderStats(
      data.stats,
      data.scanDurationMs
    );

    renderResults(
      data.results || []
    );

    $("status").innerHTML =
      "🟢 اسکن کامل شد · " +
      duration(
        Date.now() -
        started
      );

  }catch(e){

    $("status").innerHTML =
      "🔴 خطا: " +
      e.message;

  }

}

/* =========================
   STATS
========================= */

function renderStats(s,ms){

  s = s || {};

  $("stats").innerHTML = `

    <div class="stat">
      کل Candidate
      <b>${s.totalCandidates || 0}</b>
    </div>

    <div class="stat">
      Setup فعال
      <b>${s.pumpCandidates || 0}</b>
    </div>

    <div class="stat">
      رسیده به Zone
      <b>${s.reached || 0}</b>
    </div>

    <div class="stat">
      نزدیک Zone
      <b>${s.near || 0}</b>
    </div>

    <div class="stat">
      Approaching
      <b>${s.approaching || 0}</b>
    </div>

    <div class="stat">
      Invalid
      <b>${s.invalid || 0}</b>
    </div>

    <div class="stat">
      زمان اسکن
      <b>${duration(ms)}</b>
    </div>

  `;

}

/* =========================
   RESULTS
========================= */

function renderResults(items){

  const box =
    $("results");

  if(!items.length){

    box.innerHTML = `
      <div class="empty">
        هیچ Pump Candidate فعالی پیدا نشد.
      </div>
    `;

    return;
  }

  box.innerHTML =
    items.map(
      (x,i) =>
        coinHTML(
          x,
          "coin-" +
          i +
          "-" +
          x.symbol
        )
    ).join("");

}

/* =========================
   COIN CARD
========================= */

function coinHTML(x,id){

  const p =
    x.pump || {};

  const s =
    x.setup || {};

  const state =
    x.state ||
    "INVALID";

  return `

  <div
    class="coin"
    id="${id}"
    data-symbol="${x.symbol}"
  >

    <div class="coin-head">

      <div class="coin-title">

        <div>

          <div class="symbol">
            ${x.symbol}
          </div>

          <div class="market">
            ${x.category === "linear"
              ? "Futures"
              : "Spot"}
          </div>

        </div>

        <div
          class="state ${state.toLowerCase()}"
        >
          ${stateFa(state)}
        </div>

      </div>

    </div>

    <div class="metrics">

      <div class="metric">
        <span>قیمت فعلی</span>
        <b>${n(x.price,8)}</b>
      </div>

      <div class="metric">
        <span>Pump %</span>
        <b>${percent(p.pumpPercent)}</b>
      </div>

      <div class="metric">
        <span>کندل Pump</span>
        <b>${p.candles || 0}</b>
      </div>

      <div class="metric">
        <span>Green Ratio</span>
        <b>${n(
          Number(p.greenRatio || 0) * 100,
          1
        )}%</b>
      </div>

      <div class="metric">
        <span>Volume Ratio</span>
        <b>${n(
          p.volumeRatio,
          2
        )}x</b>
      </div>

      <div class="metric">
        <span>Pump Score</span>
        <b>${n(
          p.score,
          1
        )}</b>
      </div>

      <div class="metric">
        <span>Pullback</span>
        <b>${percent(
          s.pullbackPercent
        )}</b>
      </div>

      <div class="metric">
        <span>فاصله Zone</span>
        <b>${n(
          s.distancePercent,
          2
        )}%</b>
      </div>

    </div>

    <div class="reason">
      ${s.stateReason ||
        x.reason ||
        "—"}
    </div>

    <div class="actions">

      <button
        onclick="toggleDeep('${id}')"
      >
        🔎 تحلیل عمیق
      </button>

      <button
        class="danger"
        onclick="closeCoin('${id}')"
      >
        ✕ بستن
      </button>

    </div>

    <div
      class="deep"
      id="${id}-deep"
    >

      <div id="${id}-content">
        ⏳ در حال دریافت تحلیل...
      </div>

    </div>

  </div>

  `;

}

/* =========================
   CLOSE
========================= */

function closeCoin(id){

  openLive.delete(id);

  const el =
    $(id);

  if(el)
    el.remove();

}

/* =========================
   DEEP
========================= */

async function toggleDeep(id){

  const box =
    $(id + "-deep");

  if(!box)
    return;

  if(
    box.classList.contains(
      "open"
    )
  ){

    box.classList.remove(
      "open"
    );

    openLive.delete(id);

    return;

  }

  box.classList.add(
    "open"
  );

  openLive.add(id);

  const coin =
    $(id);

  const symbol =
    coin.dataset.symbol;

  await loadDeep(
    id,
    symbol
  );

}

/* =========================
   DEEP SEARCH
========================= */

async function deepSearch(){

  const symbol =
    $("symbolInput")
      .value
      .trim();

  if(!symbol)
    return;

  const id =
    "manual-" +
    symbol
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      );

  const old =
    $(id);

  if(old)
    old.remove();

  const temp =
    document.createElement(
      "div"
    );

  temp.innerHTML =
    coinHTML(
      {
        symbol:
          symbol.toUpperCase(),
        category:
          "linear",
        price:0,
        pump:{},
        setup:{},
        state:"WAITING"
      },
      id
    );

  $("results")
    .prepend(
      temp.firstElementChild
    );

  await toggleDeep(id);

}

/* =========================
   LOAD DEEP
========================= */

async function loadDeep(
  id,
  symbol
){

  const content =
    $(id + "-content");

  if(!content)
    return;

  try{

    const res =
      await fetch(
        WORKER +
        "/analyze?symbol=" +
        encodeURIComponent(
          symbol
        ) +
        "&t=" +
        Date.now()
      );

    const data =
      await res.json();

    if(!data.ok)
      throw new Error(
        data.error ||
        "Analysis failed"
      );

    content.innerHTML =
      deepHTML(
        data,
        id
      );

  }catch(e){

    content.innerHTML = `
      <div class="reason">
        🔴 خطا در تحلیل:
        ${e.message}
      </div>
    `;

  }

}

/* =========================
   DEEP HTML
========================= */

function deepHTML(
  d,
  id
){

  const pump =
    d.pump || {};

  const setup =
    d.setup || {};

  const ticker =
    d.ticker || {};

  return `

  <div class="section">

    <div class="section-title">
      🎯 وضعیت Setup
    </div>

    <div class="live-box">

      <div class="live-row">
        <span>Pump</span>
        <b>${percent(
          pump.pumpPercent
        )}</b>
      </div>

      <div class="live-row">
        <span>تعداد کندل</span>
        <b>${pump.candles || 0}</b>
      </div>

      <div class="live-row">
        <span>Green Ratio</span>
        <b>${n(
          Number(
            pump.greenRatio || 0
          ) * 100,
          1
        )}%</b>
      </div>

      <div class="live-row">
        <span>Volume Ratio</span>
        <b>${n(
          pump.volumeRatio,
          2
        )}x</b>
      </div>

      <div class="live-row">
        <span>Pump Score</span>
        <b>${n(
          pump.score,
          1
        )}</b>
      </div>

      <div class="live-row">
        <span>Red Candle</span>
        <b>
          ${
            setup.redCandle
              ? "✅ تشکیل شده"
              : "⏳ ندارد"
          }
        </b>
      </div>

      <div class="live-row">
        <span>Pullback</span>
        <b>${percent(
          setup.pullbackPercent
        )}</b>
      </div>

      <div class="live-row">
        <span>Pullback Zone</span>
        <b>
          ${n(
            setup.zoneLow,
            8
          )}
          →
          ${n(
            setup.zoneHigh,
            8
          )}
        </b>
      </div>

      <div class="live-row">
        <span>قیمت فعلی</span>
        <b>${n(
          d.price,
          8
        )}</b>
      </div>

      <div class="live-row">
        <span>Distance</span>
        <b>${n(
          setup.distancePercent,
          2
        )}%</b>
      </div>

      <div class="live-row">
        <span>وضعیت</span>
        <b>
          ${stateFa(
            setup.state
          )}
        </b>
      </div>

      <div class="live-row">
        <span>دلیل</span>
        <b>
          ${setup.stateReason ||
            setup.reason ||
            "—"}
        </b>
      </div>

    </div>

  </div>

  ${footprintHTML(
    d.footprint
  )}

  ${wallsHTML(
    d.walls
  )}

  ${oiHTML(
    d.openInterest
  )}

  ${fundingHTML(
    d.funding
  )}

  ${recentTradesHTML(
    d.recentTrades
  )}

  <div class="section">

    <div class="section-title">
      📡 Live Bybit
    </div>

    <div class="live-box">

      <div class="live-row">
        <span>Last Price</span>
        <b>${n(
          ticker.lastPrice,
          8
        )}</b>
      </div>

      <div class="live-row">
        <span>Bid</span>
        <b>${n(
          ticker.bid1Price,
          8
        )}</b>
      </div>

      <div class="live-row">
        <span>Ask</span>
        <b>${n(
          ticker.ask1Price,
          8
        )}</b>
      </div>

      <div class="live-row">
        <span>24h Change</span>
        <b class="${cls(
          ticker.price24hPcnt
        )}">
          ${percent(
            ticker.price24hPcnt
          )}
        </b>
      </div>

      <div class="live-row">
        <span>24h Volume</span>
        <b>${n(
          ticker.volume24h,
          4
        )}</b>
      </div>

    </div>

  </div>

  `;

}

/* =========================
   FOOTPRINT
========================= */

function footprintHTML(fp){

  if(!fp)
    return "";

  const rows =
    [
      "1m",
      "3m",
      "5m",
      "15m",
      "30m",
      "1h"
    ]
    .map(
      key => fp[key]
    )
    .filter(Boolean);

  return `

  <div class="section">

    <div class="section-title">
      👣 Footprint
    </div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>بازه</th>
            <th>Buy Vol</th>
            <th>Sell Vol</th>
            <th>Buy Trades</th>
            <th>Sell Trades</th>
            <th>Delta</th>
            <th>Delta %</th>
            <th>Pressure</th>
            <th>Trades</th>
          </tr>

        </thead>

        <tbody>

          ${rows.map(
            r => `

/* =========================
   COVERAGE
========================= */

function coverage(ms){

  if(!ms)
    return "0m";

  const minutes =
    ms / 60000;

  if(minutes < 1)
    return "<1m";

  if(minutes < 60)
    return (
      minutes.toFixed(1)
    ) + "m";

  return (
    minutes / 60
  ).toFixed(1) + "h";

}

/* =========================
   LIVE LOOP
========================= */

setInterval(
  async () => {

    if(!openLive.size)
      return;

    for(
      const id of [
        ...openLive
      ]
    ){

      const coin =
        $(id);

      if(!coin)
        continue;

      const deep =
        $(id + "-deep");

      if(
        !deep ||
        !deep.classList.contains(
          "open"
        )
      ){

        openLive.delete(
          id
        );

        continue;

      }

      const symbol =
        coin.dataset.symbol;

      try{

        const res =
          await fetch(
            WORKER +
            "/live?symbol=" +
            encodeURIComponent(
              symbol
            ) +
            "&t=" +
            Date.now()
          );

        const data =
          await res.json();

        if(!data.ok)
          continue;

        const content =
          $(id + "-content");

        if(!content)
          continue;

        const oldDeep =
          content.innerHTML;

        content.innerHTML =
          liveRefreshHTML(
            data,
            oldDeep
          );

      }catch(e){}

    }

  },
  3000
);
