<style>

<body>

<div class="container">

  <div class="header">
    <h1>🚀 اسکنر هوشمند جهش قیمت بای‌بیت</h1>
    <p>شناسایی جهش واقعی قیمت، کندل قرمز، ناحیه ورود و آزمایش مجدد بر پایه داده‌های واقعی بازار بای‌بیت</p>
    <div id="status" class="status">⏳ در حال اتصال به Worker...</div>
  </div>

  <div class="panel">
    <div class="title">🔎 تحلیل ارز</div>

    <div class="controls">
      <div>
        <label>نماد</label>
        <input id="symbol" value="BTCUSDT" placeholder="BTCUSDT">
      </div>

      <div>
        <label>بازار</label>
        <select id="category">
          <option value="auto">Auto</option>
          <option value="linear">Futures</option>
          <option value="spot">Spot</option>
        </select>
      </div>

      <div>
        <label>&nbsp;</label>
        <button id="analyzeBtn" class="success">🔎 تحلیل</button>
      </div>

      <div>
        <label>&nbsp;</label>
        <button id="scanBtn">🚀 شروع اسکن</button>
      </div>

      <div>
        <label>&nbsp;</label>
        <button id="stopBtn" class="danger">⛔ توقف اسکن</button>
      </div>
    </div>

    <div id="scanStatus" class="muted">اسکن متوقف است.</div>
  </div>

  <div id="scanResults" class="cards"></div>

  <div id="deepResults"></div>

</div>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const WORKER = "https://pump-scanner.29mah12.workers.dev";

const LIVE_INTERVAL = 3000;
const HISTORY_REFRESH_INTERVAL = 12000;
const SCAN_INTERVAL = 10000;
const MAX_FRONT_HISTORY = 100000;
const HISTORY_HOURS = 24;

/* =========================================================
   STATE
========================================================= */

const cards = new Map();
const closedCoins = new Set();
const alertedStates = new Map();
const previousStates = new Map();
const liveTimers = new Map();
const deepTradeHistory = new Map();
const historyTimers = new Map();

let scanTimer = null;
let scanOffset = 0;
let scanning = false;

/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function num(v,d=0){
  const x=Number(v);
  return Number.isFinite(x)?x:d;
}

function fmt(v,d=4){
  const x=Number(v);
  if(!Number.isFinite(x)) return "-";
  return x.toLocaleString("en-US",{
    maximumFractionDigits:d,
    minimumFractionDigits:0
  });
}

function fmtBig(v){
  const x=Number(v);
  if(!Number.isFinite(x))return "-";
  if(Math.abs(x)>=1e9)return (x/1e9).toFixed(2)+"B";
  if(Math.abs(x)>=1e6)return (x/1e6).toFixed(2)+"M";
  if(Math.abs(x)>=1e3)return (x/1e3).toFixed(2)+"K";
  return fmt(x,4);
}

function pct(v){
  return `${num(v).toFixed(2)}%`;
}

function getTradeTimestamp(t){
  let x=Number(t?.time ?? t?.timestamp ?? t?.T ?? 0);
  if(!Number.isFinite(x)||x<=0)return 0;
  if(x<100000000000)x*=1000;
  return x;
}

function tradePrice(t){
  return num(t?.price);
}

function tradeSize(t){
  return num(t?.size ?? t?.qty ?? t?.volume);
}

function tradeNotional(t){
  const p=tradePrice(t);
  const q=tradeSize(t);
  return num(t?.notional,p*q);
}

function tradeSide(t){
  return String(t?.side||"").toUpperCase();
}

function tradeId(t){
  return String(
    t?.execId ??
    t?.id ??
    `${getTradeTimestamp(t)}_${tradeSide(t)}_${tradePrice(t)}_${tradeSize(t)}`
  );
}

function formatDateTime(ms){
  if(!ms)return "-";
  return new Date(ms).toLocaleString("fa-IR",{
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit"
  });
}

function toLocalDateTimeValue(ms){
  const d=new Date(ms);
  const pad=x=>String(x).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function fromLocalDateTimeValue(v){
  if(!v)return 0;
  const x=new Date(v).getTime();
  return Number.isFinite(x)?x:0;
}

function safeHtml(v){
  return esc(v);
}

async function getJSON(url){
  const r=await fetch(url,{
    cache:"no-store",
    headers:{accept:"application/json"}
  });

  let data=null;
  try{
    data=await r.json();
  }catch(_){
    throw new Error(`HTTP ${r.status}`);
  }

  if(!r.ok || data?.ok===false){
    throw new Error(data?.error || `HTTP ${r.status}`);
  }

  return data;
}

/* =========================================================
   STATUS
========================================================= */

async function checkHealth(){
  try{
    const d=await getJSON(`${WORKER}/health`);
    $("status").innerHTML=
      `🟢 اتصال برقرار است — Bybit · Worker ${safeHtml(d.version||"ONLINE")}`;
  }catch(e){
    $("status").innerHTML=
      `🔴 اتصال به Worker برقرار نیست — ${safeHtml(e.message)}`;
  }
}

/* =========================================================
   SOUND
========================================================= */

let audioContext=null;
let soundEnabled=true;
let volume=.35;

try{
  soundEnabled=localStorage.getItem("pump_sound")!=="0";
  volume=num(localStorage.getItem("pump_volume"),.35);
}catch(_){}

function playAlert(){
  if(!soundEnabled)return;

  try{
    audioContext ||= new (window.AudioContext||window.webkitAudioContext)();

    if(audioContext.state==="suspended"){
      audioContext.resume().catch(()=>{});
    }

    const now=audioContext.currentTime;

    [0,0.18,0.36].forEach((delay,i)=>{
      const osc=audioContext.createOscillator();
      const gain=audioContext.createGain();

      osc.type="sine";
      osc.frequency.value=i===1?880:660;

      gain.gain.setValueAtTime(0,now+delay);
      gain.gain.linearRampToValueAtTime(volume,now+delay+.02);
      gain.gain.exponentialRampToValueAtTime(
        .001,
        now+delay+.15
      );

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start(now+delay);
      osc.stop(now+delay+.16);
    });
  }catch(_){}
}

/* =========================================================
   NORMALIZE
========================================================= */

function normalizeItem(x){
  return {
    ...x,
    symbol:String(x.symbol||"").toUpperCase(),
    price:num(
      x.price ??
      x.lastPrice ??
      x.currentPrice ??
      x.market?.price
    ),
    pumpScore:num(x.pumpScore),
    dumpScore:num(x.dumpScore),
    pumpDumpStatus:String(
      x.pumpDumpStatus ||
      (x.pumpScore>=75?"PUMP":
       x.dumpScore>=75?"DUMP":"NORMAL")
    ).toUpperCase(),
    reversal:x.reversal||{},
    movement:x.movement||{},
    market:x.market||{},
    footprint:x.footprint||{},
    orderBook:x.orderBook||x.orderbook||{},
    supportResistance:x.supportResistance||{},
    generatedAt:num(x.generatedAt,Date.now())
  };
}

/* =========================================================
   CARD
========================================================= */

function scoreBadge(item){
  const pump=num(item.pumpScore);
  const dump=num(item.dumpScore);

  if(pump>=75){
    return `<span class="badge pump">🚀 PUMP ${fmt(pump,0)}</span>`;
  }

  if(dump>=75){
    return `<span class="badge dump">🔻 DUMP ${fmt(dump,0)}</span>`;
  }

  if(pump>=40 || dump>=40){
    return `<span class="badge watch">👀 WATCH</span>`;
  }

  return `<span class="badge normal">NORMAL</span>`;
}

function renderCard(item){
  item=normalizeItem(item);

  const symbol=item.symbol;

  if(closedCoins.has(symbol))return;

  const pump=num(item.pumpScore);
  const dump=num(item.dumpScore);
  const change=num(
    item.change15 ??
    item.movement?.change15 ??
    item.market?.change15
  );

  const div=document.createElement("div");
  div.className="coin";
  div.dataset.symbol=symbol;

  div.innerHTML=`
    <div class="coin-head">
      <div class="coin-symbol">${safeHtml(symbol)}</div>
      ${scoreBadge(item)}
    </div>

    <div class="grid">

      <div class="stat">
        <div class="k">قیمت</div>
        <div class="v">${fmt(item.price,10)}</div>
      </div>

      <div class="stat">
        <div class="k">Pump</div>
        <div class="v green">${fmt(pump,0)}</div>
      </div>

      <div class="stat">
        <div class="k">Dump</div>
        <div class="v red">${fmt(dump,0)}</div>
      </div>

      <div class="stat">
        <div class="k">حرکت</div>
        <div class="v ${change>=0?"green":"red"}">${pct(change)}</div>
      </div>

    </div>

    <div style="margin-top:10px">
      <div class="muted">Pump</div>
      <div class="progress"><i style="width:${Math.min(100,pump)}%"></i></div>
    </div>

    <div style="margin-top:6px">
      <div class="muted">Dump</div>
      <div class="progress"><i style="width:${Math.min(100,dump)}%"></i></div>
    </div>

    <div class="row" style="margin-top:10px">
      <button class="small success js-deep">🔎 تحلیل عمیق</button>
      <button class="small secondary js-close">بستن</button>
    </div>
  `;

  div.querySelector(".js-deep").onclick=()=>openDeep(symbol);
  div.querySelector(".js-close").onclick=()=>{
    closedCoins.add(symbol);
    div.remove();
  };

  const old=cards.get(symbol);
  if(old)old.replaceWith(div);

  cards.set(symbol,div);

  const state=`${item.pumpDumpStatus}:${pump>=75?"P":""}:${dump>=75?"D":""}`;

  if(
    previousStates.has(symbol) &&
    previousStates.get(symbol)!==state &&
    (pump>=75 || dump>=75)
  ){
    playAlert();
  }

  previousStates.set(symbol,state);
}

/* =========================================================
   SCAN
========================================================= */

async function scanOnce(){
  if(!scanning)return;

  try{
    $("scanStatus").textContent=
      `🔄 در حال اسکن بازار... Offset: ${scanOffset}`;

    const d=await getJSON(
      `${WORKER}/scan?offset=${encodeURIComponent(scanOffset)}`
    );

    const results=Array.isArray(d.results)?d.results:[];

    results
      .map(normalizeItem)
      .sort((a,b)=>
        Math.max(b.pumpScore,b.dumpScore)-
        Math.max(a.pumpScore,a.dumpScore)
      )
      .forEach(renderCard);

    scanOffset=num(d.nextOffset,scanOffset+20);

    $("scanStatus").textContent=
      `🟢 اسکن فعال — ${results.length} بازار بررسی شد — Offset بعدی: ${scanOffset}`;

  }catch(e){
    $("scanStatus").textContent=
      `🔴 خطای اسکن: ${e.message}`;
  }
}

function startScan(){
  if(scanning)return;

  scanning=true;
  $("scanBtn").disabled=true;
  $("stopBtn").disabled=false;

  scanOnce();

  scanTimer=setInterval(
    scanOnce,
    SCAN_INTERVAL
  );
}

function stopScan(){
  scanning=false;

  $("scanBtn").disabled=false;
  $("stopBtn").disabled=true;

  if(scanTimer){
    clearInterval(scanTimer);
    scanTimer=null;
  }

  $("scanStatus").textContent="⛔ اسکن متوقف شد.";
}

/* =========================================================
   MANUAL ANALYZE
========================================================= */

async function manualAnalyze(){
  const symbol=$("symbol").value.trim();

  if(!symbol){
    alert("نماد را وارد کنید.");
    return;
  }

  $("analyzeBtn").disabled=true;
  $("analyzeBtn").textContent="⏳ در حال تحلیل...";

  try{
    const category=$("category").value;

    const url=
      `${WORKER}/analyze?symbol=${encodeURIComponent(symbol)}`+
      `&category=${encodeURIComponent(category)}`;

    const d=await getJSON(url);

    const item=normalizeItem(d);

    renderCard(item);
    await openDeep(item.symbol);

  }catch(e){
    alert(e.message);
  }finally{
    $("analyzeBtn").disabled=false;
    $("analyzeBtn").textContent="🔎 تحلیل";
  }
}

/* =========================================================
   TRADE HISTORY
========================================================= */

function mergeTrades(symbol, trades){
  symbol=String(symbol||"").toUpperCase();

  const old=deepTradeHistory.get(symbol)||[];
  const map=new Map();

  for(const t of old){
    if(!t)continue;
    const tm=getTradeTimestamp(t);
    if(!tm)continue;
    map.set(tradeId(t),{
      ...t,
      time:tm,
      price:tradePrice(t),
      size:tradeSize(t),
      notional:tradeNotional(t)
    });
  }

  for(const t of Array.isArray(trades)?trades:[]){
    if(!t)continue;

    const tm=getTradeTimestamp(t);
    const p=tradePrice(t);
    const q=tradeSize(t);

    if(!tm || p<=0 || q<=0)continue;

    map.set(tradeId(t),{
      ...t,
      time:tm,
      price:p,
      size:q,
      notional:tradeNotional(t)
    });
  }

  const cutoff=Date.now()-HISTORY_HOURS*60*60*1000;

  let arr=[...map.values()]
    .filter(t=>getTradeTimestamp(t)>=cutoff)
    .sort((a,b)=>getTradeTimestamp(a)-getTradeTimestamp(b));

  if(arr.length>MAX_FRONT_HISTORY){
    arr=arr.slice(-MAX_FRONT_HISTORY);
  }

  deepTradeHistory.set(symbol,arr);

  return arr;
}

async function loadTradeHistory(symbol,force=false){
  symbol=String(symbol||"").toUpperCase();

  try{
    const d=await getJSON(
      `${WORKER}/trades?symbol=${encodeURIComponent(symbol)}`+
      `&hours=${HISTORY_HOURS}`+
      `&_=${Date.now()}`
    );

    const arr=mergeTrades(
      symbol,
      Array.isArray(d.trades)?d.trades:
      Array.isArray(d.data?.trades)?d.data.trades:
      []
    );

    const meta=d.tradeHistory||d.data?.tradeHistory||{};

    updateHistoryMeta(symbol,{
      ...meta,
      returnedCount:arr.length,
      refreshedAt:Date.now()
    });

    return arr;

  }catch(e){

    const old=deepTradeHistory.get(symbol)||[];

    updateHistoryMeta(symbol,{
      error:e.message,
      returnedCount:old.length,
      refreshedAt:Date.now()
    });

    return old;
  }
}

/* =========================================================
   HISTORY META
========================================================= */

const historyMeta=new Map();

function updateHistoryMeta(symbol,data){
  historyMeta.set(
    String(symbol).toUpperCase(),
    data||{}
  );
}

function getHistoryMeta(symbol){
  return historyMeta.get(
    String(symbol).toUpperCase()
  )||{};
}

function historyCoverageText(symbol){
  const meta=getHistoryMeta(symbol);
  const oldest=num(meta.oldestTime);
  const newest=num(meta.newestTime);

  if(oldest && newest){
    const hours=Math.max(
      0,
      (newest-oldest)/3600000
    );

    return `پوشش تاریخچه موجود: ${hours.toFixed(2)} ساعت`;
  }

  const arr=deepTradeHistory.get(
    String(symbol).toUpperCase()
  )||[];

  if(arr.length){
    const a=getTradeTimestamp(arr[0]);
    const b=getTradeTimestamp(arr[arr.length-1]);

    if(a&&b){
      return `پوشش تاریخچه موجود: ${Math.max(0,(b-a)/3600000).toFixed(2)} ساعت`;
    }
  }

  return "پوشش تاریخچه: نامشخص";
}

/* =========================================================
   FILTER TIME
========================================================= */

function getDefaultRange(){
  const to=Date.now();
  const from=to-(24*60*60*1000);

  return {from,to};
}

function setFilterRange(deep,from,to){
  const f=deep.querySelector(".js-from-datetime");
  const t=deep.querySelector(".js-to-datetime");

  if(f)f.value=toLocalDateTimeValue(from);
  if(t)t.value=toLocalDateTimeValue(to);
}

function readFilterRange(deep){
  const f=deep.querySelector(".js-from-datetime");
  const t=deep.querySelector(".js-to-datetime");

  const from=fromLocalDateTimeValue(f?.value);
  const to=fromLocalDateTimeValue(t?.value);

  return {from,to};
}

function filterTrades(deep,allTrades){
  const {from,to}=readFilterRange(deep);

  const minInput=deep.querySelector(".js-min-price");
  const maxInput=deep.querySelector(".js-max-price");

  const minRaw=minInput?.value?.trim()||"";
  const maxRaw=maxInput?.value?.trim()||"";

  const minPrice=
    minRaw==="" ? -Infinity : Number(minRaw);

  const maxPrice=
    maxRaw==="" ? Infinity : Number(maxRaw);

  if(
    from &&
    to &&
    from>to
  ){
    throw new Error("زمان شروع نباید از زمان پایان بزرگ‌تر باشد.");
  }

  if(
    !Number.isFinite(minPrice) ||
    !Number.isFinite(maxPrice)
  ){
    throw new Error("قیمت واردشده معتبر نیست.");
  }

  if(minPrice>maxPrice){
    throw new Error("حداقل قیمت نباید از حداکثر قیمت بیشتر باشد.");
  }

  return allTrades.filter(t=>{
    const tm=getTradeTimestamp(t);
    const p=tradePrice(t);

    if(!tm || !p)return false;

    if(from && tm<from)return false;
    if(to && tm>to)return false;

    if(p<minPrice)return false;
    if(p>maxPrice)return false;

    return true;
  });
}

/* =========================================================
   AGGREGATION
========================================================= */

function aggregateTradesByPrice(trades){
  const map=new Map();

  for(const t of trades){
    const p=tradePrice(t);
    const q=tradeSize(t);
    const no=tradeNotional(t);
    const side=tradeSide(t);

    if(p<=0 || q<=0)continue;

    /*
      قیمت واقعی معامله حفظ می‌شود.
      کلید فقط برای گروه‌بندی است.
    */
    const key=p.toFixed(12);

    if(!map.has(key)){
      map.set(key,{
        price:p,
        buyCount:0,
        buyVolume:0,
        buyNotional:0,
        sellCount:0,
        sellVolume:0,
        sellNotional:0
      });
    }

    const x=map.get(key);

    if(side==="BUY"){
      x.buyCount++;
      x.buyVolume+=q;
      x.buyNotional+=no;
    }

    if(side==="SELL"){
      x.sellCount++;
      x.sellVolume+=q;
      x.sellNotional+=no;
    }
  }

  return [...map.values()]
    .map(x=>{
      const totalVol=x.buyVolume+x.sellVolume;
      const deltaVol=x.buyVolume-x.sellVolume;
      const deltaNotional=
        x.buyNotional-x.sellNotional;

      return {
        ...x,
        buyAvg:x.buyVolume?
          x.buyNotional/x.buyVolume:0,

        sellAvg:x.sellVolume?
          x.sellNotional/x.sellVolume:0,

        deltaVolume:deltaVol,
        deltaNotional,

        pressure:
          deltaVol>0?"BUY":
          deltaVol<0?"SELL":"NEUTRAL",

        totalVolume:totalVol
      };
    })
    .sort((a,b)=>b.price-a.price);
}

/* =========================================================
   SUMMARY
========================================================= */

function tradeSummary(trades){
  let buyCount=0;
  let sellCount=0;

  let buyVolume=0;
  let sellVolume=0;

  let buyNotional=0;
  let sellNotional=0;

  for(const t of trades){
    const side=tradeSide(t);
    const q=tradeSize(t);
    const no=tradeNotional(t);

    if(side==="BUY"){
      buyCount++;
      buyVolume+=q;
      buyNotional+=no;
    }

    if(side==="SELL"){
      sellCount++;
      sellVolume+=q;
      sellNotional+=no;
    }
  }

  const totalVolume=buyVolume+sellVolume;
  const totalNotional=buyNotional+sellNotional;

  return {
    count:trades.length,
    buyCount,
    sellCount,
    buyVolume,
    sellVolume,
    buyNotional,
    sellNotional,
    totalVolume,
    totalNotional,

    buyShare:
      totalVolume?
      buyVolume/totalVolume*100:0,

    sellShare:
      totalVolume?
      sellVolume/totalVolume*100:0,

    deltaVolume:
      buyVolume-sellVolume,

    deltaNotional:
      buyNotional-sellNotional
  };
}

/* =========================================================
   FILTER ATTACH
========================================================= */

function attachTradeFilter(deep){
  const symbol=deep.dataset.symbol;

  const allTrades=
    deepTradeHistory.get(symbol)||[];

  const apply=()=>{
    renderTradeFilterResult(
      deep,
      deepTradeHistory.get(symbol)||[]
    );
  };

  deep.querySelector(".js-apply-filter").onclick=apply;

  deep.querySelector(".js-clear-filter").onclick=()=>{

    const range=getDefaultRange();

    setFilterRange(
      deep,
      range.from,
      range.to
    );

    deep.querySelector(".js-min-price").value="";
    deep.querySelector(".js-max-price").value="";

    apply();
  };

  deep.querySelectorAll(".js-quick-range")
    .forEach(btn=>{
      btn.onclick=()=>{
        const hours=num(btn.dataset.hours,24);
        const to=Date.now();
        const from=to-hours*60*60*1000;

        setFilterRange(
          deep,
          from,
          to
        );

        apply();
      };
    });

  [
    ".js-from-datetime",
    ".js-to-datetime",
    ".js-min-price",
    ".js-max-price"
  ].forEach(sel=>{
    const el=deep.querySelector(sel);
    if(el){
      el.addEventListener("change",apply);
      el.addEventListener("keydown",e=>{
        if(e.key==="Enter")apply();
      });
    }
  });

  const range=getDefaultRange();

  setFilterRange(
    deep,
    range.from,
    range.to
  );

  renderTradeFilterResult(
    deep,
    allTrades
  );
}

    <div class="muted" style="margin-top:10px">
      آخرین به‌روزرسانی:
      ${formatDateTime(Date.now())}
    </div>

  `;

  deep.querySelector(".js-close-deep").onclick=()=>{
    stopLive(symbol);
    stopHistoryRefresh(symbol);
    deep.remove();
  };

  return deep;
}

/* =========================================================
   OPEN DEEP
========================================================= */

async function openDeep(symbol){
  symbol=String(symbol||"").trim().toUpperCase();

  if(!symbol)return;

  stopLive(symbol);
  stopHistoryRefresh(symbol);

  const old=document.querySelector(
    `.deep[data-symbol="${CSS.escape(symbol)}"]`
  );

  if(old)old.remove();

  const holder=document.createElement("div");

  holder.className="panel";
  holder.innerHTML=
    `<div class="loading">
      ⏳ در حال دریافت تحلیل عمیق ${safeHtml(symbol)}...
    </div>`;

  $("deepResults").prepend(holder);

  try{

    const d=await getJSON(
      `${WORKER}/analyze?symbol=${encodeURIComponent(symbol)}`+
      `&category=${encodeURIComponent($("category").value)}`+
      `&_=${Date.now()}`
    );

    const initial=
      Array.isArray(d.recentTrades)?
      d.recentTrades:
      [];

    mergeTrades(symbol,initial);

    if(d.tradeHistory){
      updateHistoryMeta(symbol,d.tradeHistory);
    }

    await loadTradeHistory(symbol,true);

    const deep=buildDeepHtml(d,symbol);

    holder.replaceWith(deep);

    attachTradeFilter(deep);

    startLive(symbol);

    startHistoryRefresh(symbol);

  }catch(e){

    holder.innerHTML=
      `<div class="notice" style="color:#ff8e9c">
        ❌ خطا در تحلیل ${safeHtml(symbol)}:
        ${safeHtml(e.message)}
      </div>`;

  }
}

/* =========================================================
   LIVE
========================================================= */

function startLive(symbol){
  symbol=String(symbol||"").toUpperCase();

  stopLive(symbol);

  const timer=setInterval(
    ()=>refreshLive(symbol),
    LIVE_INTERVAL
  );

  liveTimers.set(symbol,timer);

  refreshLive(symbol);
}

function stopLive(symbol){
  const timer=liveTimers.get(
    String(symbol).toUpperCase()
  );

  if(timer){
    clearInterval(timer);
    liveTimers.delete(
      String(symbol).toUpperCase()
    );
  }
}

async function refreshLive(symbol){
  symbol=String(symbol||"").toUpperCase();

  try{

    const d=await getJSON(
      `${WORKER}/live?symbol=${encodeURIComponent(symbol)}`+
      `&_=${Date.now()}`
    );

    mergeTrades(
      symbol,
      Array.isArray(d.recentTrades)?
      d.recentTrades:
      []
    );

    const deep=document.querySelector(
      `.deep[data-symbol="${CSS.escape(symbol)}"]`
    );

    if(!deep)return;

    const all=deepTradeHistory.get(symbol)||[];

    /*
      فیلتر و تجمیع بدون از بین بردن
      تاریخچه قبلی دوباره محاسبه می‌شود.
    */
    renderTradeFilterResult(
      deep,
      all
    );

    const tbody=deep.querySelector(
      ".js-recent-trades"
    );

    if(tbody){

      const latest=
        all
          .slice(-100)
          .sort((a,b)=>
            getTradeTimestamp(b)-
            getTradeTimestamp(a)
          );

      tbody.innerHTML=
        latest.map(t=>{
          const side=tradeSide(t);

          return `
            <tr class="${
              side==="BUY"?"buy":"sell"
            }">

              <td>
                ${safeHtml(
                  formatDateTime(
                    getTradeTimestamp(t)
                  )
                )}
              </td>

              <td class="${
                side==="BUY"?
                "green":"red"
              }">
                ${
                  side==="BUY"?
                  "🟢 BUY":
                  "🔴 SELL"
                }
              </td>

              <td>${fmt(tradePrice(t),12)}</td>
              <td>${fmtBig(tradeSize(t))}</td>
              <td>${fmtBig(tradeNotional(t))}</td>
              <td>${t.isBlockTrade?"🧱":"—"}</td>

            </tr>
          `;
        }).join("");

    }

  }catch(_){}
}

/* =========================================================
   HISTORY REFRESH
========================================================= */

function startHistoryRefresh(symbol){
  symbol=String(symbol||"").toUpperCase();

  stopHistoryRefresh(symbol);

  const timer=setInterval(
    async()=>{
      await loadTradeHistory(symbol,true);

      const deep=document.querySelector(
        `.deep[data-symbol="${CSS.escape(symbol)}"]`
      );

      if(deep){
        renderTradeFilterResult(
          deep,
          deepTradeHistory.get(symbol)||[]
        );

        const meta=getHistoryMeta(symbol);

        const notice=deep.querySelector(
          ".js-history-meta"
        );

        if(notice){
          notice.textContent=
            historyCoverageText(symbol);
        }
      }
    },
    HISTORY_REFRESH_INTERVAL
  );

  historyTimers.set(symbol,timer);
}

function stopHistoryRefresh(symbol){
  symbol=String(symbol||"").toUpperCase();

  const timer=historyTimers.get(symbol);

  if(timer){
    clearInterval(timer);
    historyTimers.delete(symbol);
  }
}

/* =========================================================
   LIVE CARD UPDATE
========================================================= */

function updateCardFromLive(symbol,d){
  const card=cards.get(symbol);
  if(!card)return;

  const price=num(d.price);

  const priceNode=card.querySelector(
    ".stat .v"
  );

  if(priceNode && price){
    priceNode.textContent=fmt(price,10);
  }
}

   BUTTONS
========================================================= */

$("analyzeBtn").onclick=manualAnalyze;
$("scanBtn").onclick=startScan;
$("stopBtn").onclick=stopScan;

$("stopBtn").disabled=true;

$("symbol").addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter")manualAnalyze();
  }
);

   INITIAL
========================================================= */

checkHealth();

setTimeout(
  checkHealth,
  10000
);

setInterval(
  checkHealth,
  30000
);

window.addEventListener(
  "beforeunload",
  ()=>{
    liveTimers.forEach(t=>clearInterval(t));
    historyTimers.forEach(t=>clearInterval(t));
    if(scanTimer)clearInterval(scanTimer);
  }
);

</script>
