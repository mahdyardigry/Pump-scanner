<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اسکنر هوشمند جهش قیمت بای‌بیت</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:#071018;
  color:#e8eef5;
  font-family:Tahoma,Arial,sans-serif;
  line-height:1.7
}
button,input,select{font:inherit}
button{cursor:pointer}
.container{max-width:1450px;margin:auto;padding:18px}
header{
  background:linear-gradient(135deg,#101d2a,#0b151f);
  border:1px solid #203242;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px
}
h1{margin:0 0 5px;font-size:25px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 10px}
.muted{color:#91a1b1;font-size:13px}
.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:12px;
  padding:7px 12px;
  border-radius:999px;
  background:#102331;
  border:1px solid #244257;
  font-size:13px
}
.status.ok{color:#55e39a}
.status.bad{color:#ff6f78}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  background:#0c1721;
  border:1px solid #1d303e;
  border-radius:16px;
  padding:15px;
  margin-bottom:16px
}
.control{display:flex;flex-direction:column;gap:6px}
.control label{font-size:12px;color:#91a1b1}
input,select{
  width:100%;
  background:#071018;
  color:#e8eef5;
  border:1px solid #294050;
  border-radius:10px;
  padding:10px
}
input:focus,select:focus{
  outline:none;
  border-color:#3d87b3
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:end
}
button{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  color:#fff;
  background:#176b9d
}
button:hover{filter:brightness(1.12)}
button.secondary{background:#253541}
button.danger{background:#9a3038}
button.success{background:#187a4b}

.range-box{
  grid-column:1/-1;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center
}
.range-box input{padding:0}
.range-value{
  min-width:55px;
  text-align:center;
  padding:5px 9px;
  background:#071018;
  border:1px solid #294050;
  border-radius:8px
}

.scan-state{
  margin-bottom:16px;
  padding:12px 15px;
  border-radius:12px;
  background:#0b1822;
  border:1px solid #203442;
  color:#b6c5d1
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-bottom:16px
}
.stat{
  background:#0c1721;
  border:1px solid #1d303e;
  border-radius:14px;
  padding:12px;
  text-align:center
}
.stat b{
  display:block;
  font-size:20px;
  margin-top:3px
}

.results{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:14px
}
.card{
  background:#0b1620;
  border:1px solid #213544;
  border-radius:17px;
  overflow:hidden
}
.card-head{
  padding:15px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
  border-bottom:1px solid #1d303d
}
.symbol{
  font-size:19px;
  font-weight:bold
}
.price{font-size:20px;font-weight:bold}
.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:7px
}
.badge{
  display:inline-flex;
  align-items:center;
  padding:3px 8px;
  border-radius:999px;
  font-size:11px;
  border:1px solid #304452;
  background:#14232e;
  color:#b9c8d4
}
.badge.green{color:#55e39a;border-color:#286c50;background:#10291f}
.badge.red{color:#ff7078;border-color:#713238;background:#2a1317}
.badge.yellow{color:#ffd56a;border-color:#715b25;background:#2a2412}

.card-body{padding:15px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
  gap:8px
}
.metric{
  background:#08131c;
  border:1px solid #1b2d3a;
  border-radius:10px;
  padding:9px
}
.metric small{
  display:block;
  color:#8497a7;
  font-size:11px
}
.metric strong{font-size:14px}
.green-text{color:#55e39a}
.red-text{color:#ff7078}
.yellow-text{color:#ffd56a}

.card-actions{
  display:flex;
  gap:7px;
  margin-top:12px
}
.card-actions button{flex:1}

.deep{
  margin-top:12px;
  border-top:1px solid #1d303d;
  padding-top:14px
}
.section{
  margin-top:14px;
  background:#08131c;
  border:1px solid #1b2d3a;
  border-radius:12px;
  padding:12px
}
.section:first-child{margin-top:0}

.table-wrap{
  width:100%;
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  direction:ltr;
  scrollbar-width:thin
}
.table-wrap table{
  direction:rtl;
  width:max-content;
  min-width:100%;
  border-collapse:collapse
}
th,td{
  border-bottom:1px solid #1c2d39;
  padding:8px 10px;
  text-align:center;
  white-space:nowrap;
  font-size:12px
}
th{
  color:#8fa3b2;
  background:#0e1b25;
  position:sticky;
  top:0;
  z-index:1
}
.buy{color:#55e39a}
.sell{color:#ff7078}
.neutral{color:#c2ccd4}

.filter{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:8px;
  margin-bottom:10px
}
.filter label{
  display:block;
  color:#8799a8;
  font-size:11px;
  margin-bottom:4px
}
.filter-actions{
  display:flex;
  align-items:end;
  gap:6px
}
.filter-actions button{
  flex:1;
  padding:9px
}
.filter-summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:7px;
  margin:10px 0
}
.filter-summary .metric{
  text-align:center
}
.empty{
  padding:25px;
  text-align:center;
  color:#8395a4
}
.error{
  padding:12px;
  background:#281317;
  border:1px solid #6d3038;
  color:#ff8790;
  border-radius:10px
}
.loading{
  padding:25px;
  text-align:center;
  color:#91a5b4
}

details{
  background:#0b1721;
  border:1px solid #1d303d;
  border-radius:11px;
  margin-top:9px
}
summary{
  cursor:pointer;
  padding:10px 12px;
  color:#b9c8d4
}
details>.section{
  margin:0;
  border:0;
  border-top:1px solid #1d303d;
  border-radius:0
}

.sound-row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}
.sound-row input[type=range]{width:100px}

@media(max-width:650px){
  .container{padding:9px}
  header{padding:15px}
  h1{font-size:21px}
  .results{grid-template-columns:1fr}
  .card-head{flex-direction:column}
  .controls{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>📊 اسکنر هوشمند جهش قیمت بای‌بیت</h1>
  <div class="muted">
    تحلیل واقعی بازار بر پایه داده‌های Bybit و محاسبات 15 دقیقه‌ای
  </div>
  <div id="status" class="status">🟡 در حال اتصال به Worker...</div>
</header>

<div class="controls">

  <div class="control">
    <label>🔎 نماد</label>
    <input id="symbolInput" value="BTCUSDT" placeholder="BTCUSDT">
  </div>

  <div class="control">
    <label>بازار</label>
    <select id="category">
      <option value="auto">خودکار</option>
      <option value="linear">Futures</option>
      <option value="spot">Spot</option>
    </select>
  </div>

  <div class="control">
    <label>سخت‌گیری سیگنال</label>
    <div class="range-box">
      <input id="strictness" type="range" min="0" max="100" value="20">
      <span id="strictnessValue" class="range-value">20</span>
    </div>
  </div>

  <div class="control">
    <label>صدا</label>
    <div class="sound-row">
      <button id="soundToggle" class="secondary">🔇 خاموش</button>
      <button id="testSound" class="secondary">🔊 تست</button>
      <input id="volume" type="range" min="0" max="100" value="60">
    </div>
  </div>

  <div class="actions">
    <button id="analyzeBtn" class="success">🔎 تحلیل نماد</button>
    <button id="startBtn">▶️ شروع اسکن</button>
    <button id="stopBtn" class="danger">⏹ توقف</button>
  </div>

</div>

<div id="scanState" class="scan-state">
  آماده دریافت داده واقعی از Bybit
</div>

<div id="stats" class="stats">
  <div class="stat">
    سیگنال‌ها
    <b id="signalCount">0</b>
  </div>
  <div class="stat">
    وارد ناحیه
    <b id="reachedCount">0</b>
  </div>
  <div class="stat">
    نزدیک ناحیه
    <b id="nearCount">0</b>
  </div>
  <div class="stat">
    کارت‌های باز
    <b id="openCount">0</b>
  </div>
</div>

<div id="results" class="results">
  <div class="empty">برای شروع، یک نماد را تحلیل کنید یا اسکن را شروع کنید.</div>
</div>

</div>

<script>
"use strict";

const WORKER_URL = "https://pump-scanner.29mah12.workers.dev";

const LIVE_INTERVAL = 3000;

let scanning = false;
let scanTimer = null;

const cards = new Map();
const closedCoins = new Set();
const alertedStates = new Set();
const previousStates = new Map();
const liveTimers = new Map();

let audioContext = null;

const soundEnabled =
  localStorage.getItem("personal_sound") === "1";

let soundOn = soundEnabled;

let volume =
  Number(localStorage.getItem("personal_volume") ?? 60);

const $ = id => document.getElementById(id);

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function num(value, fallback=0){
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function fmt(value,digits=4){
  const n = Number(value);
  if(!Number.isFinite(n)) return "—";
  return n.toLocaleString("en-US",{
    maximumFractionDigits:digits
  });
}

function fmtInteger(value){
  const n = Number(value);
  if(!Number.isFinite(n)) return "—";
  return Math.round(n).toLocaleString("en-US");
}

function fmtCompact(value){
  const n = Number(value);
  if(!Number.isFinite(n)) return "—";

  const a=Math.abs(n);

  if(a>=1e12) return (n/1e12).toFixed(2)+"T";
  if(a>=1e9) return (n/1e9).toFixed(2)+"B";
  if(a>=1e6) return (n/1e6).toFixed(2)+"M";
  if(a>=1e3) return (n/1e3).toFixed(2)+"K";

  return fmt(n,4);
}

function pct(value,digits=2){
  const n=Number(value);
  if(!Number.isFinite(n)) return "—";
  return `${n>=0?"+":""}${n.toFixed(digits)}%`;
}

function valueClass(value){
  const n=Number(value);
  if(!Number.isFinite(n)) return "neutral";
  if(n>0) return "green-text";
  if(n<0) return "red-text";
  return "neutral";
}

function stateClass(state){
  if(state==="REACHED") return "green";
  if(state==="NEAR") return "yellow";
  if(state==="APPROACHING") return "yellow";
  if(state==="INVALIDATED") return "red";
  return "";
}

function stateLabel(state){
  switch(state){
    case "REACHED": return "🎯 وارد ناحیه";
    case "NEAR": return "🟡 نزدیک ناحیه";
    case "APPROACHING": return "🟠 در حال نزدیک شدن";
    case "INVALIDATED": return "🔴 نامعتبر";
    default: return "⚪ در انتظار";
  }
}

function getSymbol(item){
  return String(
    item?.symbol ||
    item?.ticker?.symbol ||
    item?.name ||
    ""
  ).toUpperCase();
}

function normalizeItem(item){
  const pump=item?.pump || {};
  const setup=item?.setup || {};
  const state=item?.state || {};

  return {
    ...item,
    symbol:getSymbol(item),
    price:num(
      item?.price ??
      item?.ticker?.lastPrice ??
      item?.lastPrice ??
      pump?.currentPrice
    ),
    pumpPercent:num(
      item?.pumpPercent ??
      pump?.pumpPercent ??
      pump?.percent
    ),
    volumeMultiplier:num(
      item?.volumeMultiplier ??
      pump?.volumeMultiplier
    ),
    zoneLow:num(
      item?.zoneLow ??
      pump?.zoneLow ??
      setup?.zoneLow
    ),
    zoneHigh:num(
      item?.zoneHigh ??
      pump?.zoneHigh ??
      setup?.zoneHigh
    ),
    state:String(
      item?.stateName ??
      item?.stateCode ??
      state?.code ??
      item?.status ??
      ""
    ).toUpperCase(),
    score:num(
      item?.score ??
      item?.signalScore ??
      setup?.score
    )
  };
}

function ensureAudio(){
  if(!audioContext){
    const AC=window.AudioContext || window.webkitAudioContext;
    if(AC) audioContext=new AC();
  }

  if(audioContext?.state==="suspended"){
    audioContext.resume().catch(()=>{});
  }
}

function playAlert(type="normal"){
  if(!soundOn) return;

  ensureAudio();

  if(!audioContext) return;

  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();

  const now=audioContext.currentTime;

  const frequencies={
    REACHED:880,
    NEAR:660,
    APPROACHING:520
  };

  osc.frequency.value=frequencies[type] || 600;
  osc.type="sine";

  const v=Math.max(0,Math.min(1,volume/100));

  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(
    Math.max(0.0001,v*0.12),
    now+0.02
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.25
  );

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.start(now);
  osc.stop(now+0.27);
}

function updateSoundUI(){
  $("soundToggle").textContent =
    soundOn ? "🔊 روشن" : "🔇 خاموش";

  $("volume").value=volume;
}

$("soundToggle").addEventListener("click",()=>{
  soundOn=!soundOn;

  localStorage.setItem(
    "personal_sound",
    soundOn ? "1" : "0"
  );

  if(soundOn){
    ensureAudio();
    playAlert("normal");
  }

  updateSoundUI();
});

$("testSound").addEventListener("click",()=>{
  ensureAudio();
  playAlert("REACHED");
});

$("volume").addEventListener("input",e=>{
  volume=Number(e.target.value);

  localStorage.setItem(
    "personal_volume",
    String(volume)
  );
});

$("strictness").addEventListener("input",e=>{
  $("strictnessValue").textContent=e.target.value;

  localStorage.setItem(
    "personal_strictness",
    e.target.value
  );
});

const savedStrictness=
  localStorage.getItem("personal_strictness");

if(savedStrictness!==null){
  $("strictness").value=savedStrictness;
}

$("strictnessValue").textContent=$("strictness").value;

updateSoundUI();

async function fetchJson(url,options={}){
  const response=await fetch(url,{
    cache:"no-store",
    ...options
  });

  let data=null;

  try{
    data=await response.json();
  }catch{
    throw new Error("پاسخ Worker معتبر نیست.");
  }

  if(!response.ok){
    throw new Error(
      data?.error ||
      `HTTP ${response.status}`
    );
  }

  if(data?.ok===false){
    throw new Error(
      data?.error ||
      "Worker خطا برگرداند."
    );
  }

  return data;
}

async function checkHealth(){
  try{
    const data=await fetchJson(
      `${WORKER_URL}/health?t=${Date.now()}`
    );

    $("status").className="status ok";
    $("status").textContent=
      `🟢 اتصال برقرار است — Bybit${data?.version ? " · "+data.version : ""}`;

  }catch(error){

    $("status").className="status bad";
    $("status").textContent=
      "🔴 اتصال به Worker برقرار نیست";
  }
}

function updateStats(){
  let signal=0;
  let reached=0;
  let near=0;

  for(const [,item] of cards){

    signal++;

    const state=String(
      item?.state ||
      item?.stateCode ||
      ""
    ).toUpperCase();

    if(state==="REACHED") reached++;
    if(state==="NEAR" || state==="APPROACHING") near++;
  }

  $("signalCount").textContent=signal;
  $("reachedCount").textContent=reached;
  $("nearCount").textContent=near;
  $("openCount").textContent=cards.size;
}

function alertState(item){
  const symbol=getSymbol(item);
  const state=String(
    item?.state ||
    item?.stateCode ||
    ""
  ).toUpperCase();

  if(!symbol || !state) return;

  const previous=previousStates.get(symbol);

  previousStates.set(symbol,state);

  if(
    state==="REACHED" ||
    state==="NEAR" ||
    state==="APPROACHING"
  ){

    const key=`${symbol}:${state}`;

    if(previous!==state && !alertedStates.has(key)){
      alertedStates.add(key);
      playAlert(state);
    }
  }
}

function cardHead(item){
  const x=normalizeItem(item);

  const state=x.state || "WATCH";
  const badgeClass=stateClass(state);

  return `
    <div class="card-head">

      <div>
        <div class="symbol">${escapeHtml(x.symbol)}</div>

        <div class="badges">
          <span class="badge ${badgeClass}">
            ${escapeHtml(stateLabel(state))}
          </span>

          ${
            x.pumpPercent
              ? `<span class="badge">جهش ${escapeHtml(pct(x.pumpPercent))}</span>`
              : ""
          }

          ${
            x.score
              ? `<span class="badge">امتیاز ${escapeHtml(fmt(x.score,0))}</span>`
              : ""
          }
        </div>
      </div>

      <div class="${valueClass(x.pumpPercent)}">
        <div class="price">${escapeHtml(fmt(x.price,12))}</div>
      </div>

    </div>
  `;
}

function cardMainMetrics(item){
  const x=normalizeItem(item);

  return `
    <div class="grid">

      <div class="metric">
        <small>قیمت</small>
        <strong>${escapeHtml(fmt(x.price,12))}</strong>
      </div>

      <div class="metric">
        <small>درصد جهش</small>
        <strong class="${valueClass(x.pumpPercent)}">
          ${escapeHtml(pct(x.pumpPercent))}
        </strong>
      </div>

      <div class="metric">
        <small>ضریب حجم</small>
        <strong>${escapeHtml(fmt(x.volumeMultiplier,2))}x</strong>
      </div>

      <div class="metric">
        <small>کف ناحیه</small>
        <strong>${escapeHtml(fmt(x.zoneLow,12))}</strong>
      </div>

      <div class="metric">
        <small>سقف ناحیه</small>
        <strong>${escapeHtml(fmt(x.zoneHigh,12))}</strong>
      </div>

      <div class="metric">
        <small>وضعیت</small>
        <strong>${escapeHtml(stateLabel(x.state))}</strong>
      </div>

    </div>
  `;
}

function createCard(item){
  const x=normalizeItem(item);

  if(!x.symbol) return;

  if(closedCoins.has(x.symbol)) return;

  cards.set(x.symbol,item);

  const card=document.createElement("article");

  card.className="card";
  card.id=`card-${x.symbol}`;

  card.innerHTML=`
    ${cardHead(item)}

    <div class="card-body">

      ${cardMainMetrics(item)}

      <div class="card-actions">
        <button class="deepBtn">🔬 تحلیل عمیق</button>
        <button class="closeBtn danger">✕ بستن</button>
      </div>

      <div class="deep"></div>

    </div>
  `;

  $("results").prepend(card);

  card.querySelector(".closeBtn")
    .addEventListener("click",()=>{
      closeCard(x.symbol);
    });

  card.querySelector(".deepBtn")
    .addEventListener("click",()=>{
      deepAnalysis(x.symbol,card);
    });

  alertState(item);
  updateStats();
}

function updateCard(item){
  const x=normalizeItem(item);

  if(!x.symbol) return;

  cards.set(x.symbol,item);
  alertState(item);

  const card=$(`card-${x.symbol}`);

  if(!card){
    createCard(item);
    return;
  }

  const head=card.querySelector(".card-head");
  const body=card.querySelector(".card-body");

  if(head){
    head.outerHTML=cardHead(item);
  }

  if(body){
    const oldActions=body.querySelector(".card-actions");
    const oldDeep=body.querySelector(".deep");

    const html=`
      ${cardMainMetrics(item)}

      <div class="card-actions">
        <button class="deepBtn">🔬 تحلیل عمیق</button>
        <button class="closeBtn danger">✕ بستن</button>
      </div>

      <div class="deep"></div>
    `;

    body.innerHTML=html;

    if(oldDeep && oldDeep.innerHTML){
      body.querySelector(".deep").innerHTML=
        oldDeep.innerHTML;
    }

    body.querySelector(".closeBtn")
      .addEventListener("click",()=>{
        closeCard(x.symbol);
      });

    body.querySelector(".deepBtn")
      .addEventListener("click",()=>{
        deepAnalysis(x.symbol,card);
      });
  }

  updateStats();
}

function closeCard(symbol){
  symbol=String(symbol).toUpperCase();

  closedCoins.add(symbol);

  const timer=liveTimers.get(symbol);

  if(timer){
    clearInterval(timer);
    liveTimers.delete(symbol);
  }

  const card=$(`card-${symbol}`);

  if(card) card.remove();

  cards.delete(symbol);

  updateStats();
}

  if(Array.isArray(data)){
    list=data;
  }else if(Array.isArray(data?.results)){
    list=data.results;
  }else if(Array.isArray(data?.items)){
    list=data.items;
  }else if(Array.isArray(data?.data)){

    return;

async function analyzeSymbol(symbol){
  symbol=String(symbol)
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,"");

  if(!symbol){
    $("results").innerHTML=
      `<div class="error">نماد معتبر وارد کنید.</div>`;
    return;
  }

  $("scanState").textContent=
    `🔎 در حال تحلیل ${symbol} ...`;

  try{

    const category=$("category").value;

    let url=
      `${WORKER_URL}/analyze?symbol=${encodeURIComponent(symbol)}`;

    if(category && category!=="auto"){
      url+=`&category=${encodeURIComponent(category)}`;
    }

    const data=await fetchJson(
      `${url}&t=${Date.now()}`
    );

    if(data?.result){
      if(!data.result.symbol){
        data.result.symbol=symbol;
      }

      if(!cards.has(symbol)){
        createCard(data.result);
      }else{
        updateCard(data.result);
      }

function startLive(symbol){
  symbol=String(symbol).toUpperCase();

  if(liveTimers.has(symbol)) return;

  const timer=setInterval(
    ()=>refreshLive(symbol),
    LIVE_INTERVAL
  );

  liveTimers.set(symbol,timer);
}

async function refreshLive(symbol){
  if(closedCoins.has(symbol)){
    const timer=liveTimers.get(symbol);

    if(timer){
      clearInterval(timer);
      liveTimers.delete(symbol);
    }

    return;
  }

  try{

    const data=await fetchJson(
      `${WORKER_URL}/live?symbol=${encodeURIComponent(symbol)}&t=${Date.now()}`
    );

    const item=data?.result || data?.data;

    if(item){
      updateCard(item);
    }

  }catch(error){
    console.warn("Live:",symbol,error);
  }
}

function formatTradeTime(timestamp){
  const n=Number(timestamp);

  if(!Number.isFinite(n)) return "—";

  const d=new Date(
    n < 1e12 ? n*1000 : n
  );

  if(Number.isNaN(d.getTime())) return "—";

  return d.toLocaleTimeString(
    "fa-IR",
    {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    }
  );
}

function formatTradeDate(timestamp){
  const n=Number(timestamp);

  if(!Number.isFinite(n)) return "—";

  const d=new Date(
    n < 1e12 ? n*1000 : n
  );

  if(Number.isNaN(d.getTime())) return "—";

  return d.toLocaleDateString("fa-IR");
}

function decimalPlaces(value){
  const s=String(value ?? "").trim();

  if(!s.includes(".")) return 0;

  return s.split(".")[1]
    .replace(/0+$/,"")
    .length;
}

function decimalToScaled(value,scale){
  const s=String(value ?? "").trim();

  if(!/^-?\d+(?:\.\d+)?$/.test(s)){
    return null;
  }

  const negative=s.startsWith("-");
  const raw=negative ? s.slice(1) : s;

  const parts=raw.split(".");
  const integer=parts[0] || "0";
  const fraction=(parts[1] || "").padEnd(scale,"0").slice(0,scale);

  try{
    const result=
      BigInt(integer)*10n**BigInt(scale)+
      BigInt(fraction || "0");

    return negative ? -result : result;

  }catch{
    return null;
  }
}

function compareDecimalStrings(a,b){
  const sa=String(a ?? "").trim();
  const sb=String(b ?? "").trim();

  const pa=decimalPlaces(sa);
  const pb=decimalPlaces(sb);
  const scale=Math.max(pa,pb);

  const aa=decimalToScaled(sa,scale);
  const bb=decimalToScaled(sb,scale);

  if(aa===null || bb===null){
    const na=Number(sa);
    const nb=Number(sb);

    if(!Number.isFinite(na) || !Number.isFinite(nb)){
      return NaN;
    }

    return na===nb ? 0 : na<nb ? -1 : 1;
  }

  return aa===bb ? 0 : aa<bb ? -1 : 1;
}

function tradeTimestamp(trade){
  return Number(
    trade?.time ??
    trade?.timestamp ??
    trade?.T ??
    trade?.ts ??
    0
  );
}

function tradePriceText(trade){
  return String(
    trade?.price ??
    trade?.p ??
    ""
  ).trim();
}

function tradeSize(trade){
  return num(
    trade?.size ??
    trade?.qty ??
    trade?.volume ??
    trade?.q
  );
}

function tradeSide(trade){
  const side=String(
    trade?.side ??
    trade?.S ??
    ""
  ).toLowerCase();

  if(side==="buy") return "Buy";
  if(side==="sell") return "Sell";

  return "";
}

function tradeNotional(trade){
  const direct=Number(
    trade?.notional ??
    trade?.value
  );

  if(Number.isFinite(direct) && direct!==0){
    return Math.abs(direct);
  }

  return Math.abs(
    num(tradePriceText(trade))*
    tradeSize(trade)
  );
}

function filterTrades(trades,options={}){
  if(!Array.isArray(trades)) return [];

  const {
    fromTime="",
    toTime="",
    minPrice="",
    maxPrice=""
  }=options;

  const from=
    fromTime
      ? fromTime.split(":").map(Number)
      : null;

  const to=
    toTime
      ? toTime.split(":").map(Number)
      : null;

  const fromSec=
    from
      ? from[0]*3600+
        from[1]*60+
        (from[2]||0)
      : null;

  const toSec=
    to
      ? to[0]*3600+
        to[1]*60+
        (to[2]||0)
      : null;

  const useMin=minPrice!=="";
  const useMax=maxPrice!=="";

  return trades.filter(trade=>{

    const ts=tradeTimestamp(trade);

    if(!Number.isFinite(ts) || ts<=0){
      return false;
    }

    const date=new Date(
      ts < 1e12 ? ts*1000 : ts
    );

    if(Number.isNaN(date.getTime())){
      return false;
    }

    if(fromSec!==null || toSec!==null){

      const currentSec=
        date.getHours()*3600+
        date.getMinutes()*60+
        date.getSeconds();

      if(
        fromSec!==null &&
        toSec!==null
      ){

        if(fromSec<=toSec){

          if(
            currentSec<fromSec ||
            currentSec>toSec
          ){
            return false;
          }

        }else{

          if(
            currentSec>toSec &&
            currentSec<fromSec
          ){
            return false;
          }
        }

      }else if(fromSec!==null){

        if(currentSec<fromSec){
          return false;
        }

      }else if(toSec!==null){

        if(currentSec>toSec){
          return false;
        }
      }
    }

    const priceText=tradePriceText(trade);

    if(!priceText) return false;

    if(useMin){

      const c=compareDecimalStrings(
        priceText,
        minPrice
      );

      if(Number.isNaN(c) || c<0){
        return false;
      }
    }

    if(useMax){

      const c=compareDecimalStrings(
        priceText,
        maxPrice
      );

      if(Number.isNaN(c) || c>0){
        return false;
      }
    }

    return true;
  });
}

function aggregateTradesByPrice(trades){
  const map=new Map();

  for(const trade of trades){

    const rawPrice=tradePriceText(trade);

    if(!rawPrice) continue;

    const key=normalizeDecimalString(rawPrice);

    const price=Number(rawPrice);

    if(!Number.isFinite(price)) continue;

    const size=tradeSize(trade);
    const notional=tradeNotional(trade);
    const side=tradeSide(trade);

    if(!map.has(key)){
      map.set(key,{
        priceText:rawPrice,
        price,
        buyVolume:0,
        sellVolume:0,
        buyNotional:0,
        sellNotional:0,
        buyTrades:0,
        sellTrades:0,
        totalTrades:0,
        totalVolume:0,
        totalNotional:0
      });
    }

    const x=map.get(key);

    x.totalTrades++;
    x.totalVolume+=size;
    x.totalNotional+=notional;

    if(side==="Buy"){
      x.buyVolume+=size;
      x.buyNotional+=notional;
      x.buyTrades++;
    }else if(side==="Sell"){
      x.sellVolume+=size;
      x.sellNotional+=notional;
      x.sellTrades++;
    }
  }

  return [...map.values()]
    .sort((a,b)=>b.price-a.price);
}

function normalizeDecimalString(value){
  let s=String(value ?? "").trim();

  if(!s) return "";

  if(!/^-?\d+(?:\.\d+)?$/.test(s)){
    return s;
  }

  let negative=false;

  if(s.startsWith("-")){
    negative=true;
    s=s.slice(1);
  }

  let [i,f]=s.split(".");

  i=i.replace(/^0+(?=\d)/,"");

  if(f!==undefined){
    f=f.replace(/0+$/,"");
  }

  let out=f ? `${i}.${f}` : i;

  if(out==="") out="0";

  return negative && out!=="0"
    ? "-"+out
    : out;
}

function setupTradeFilter(result,deep){
  const trades=
    Array.isArray(result?.recentTrades)
      ? result.recentTrades
      : [];

  const symbol=
    String(result?.symbol || "symbol")
      .replace(/[^A-Za-z0-9_-]/g,"");

  const id=`filter-${symbol}`;

  const from=$(`${id}-from`);
  const to=$(`${id}-to`);
  const min=$(`${id}-min`);
  const max=$(`${id}-max`);
  const apply=$(`${id}-apply`);
  const clear=$(`${id}-clear`);
  const content=$(`${id}-content`);
  const info=$(`${id}-info`);

  if(
    !from ||
    !to ||
    !min ||
    !max ||
    !apply ||
    !clear ||
    !content
  ) return;

  function applyFilter(){

    const filtered=filterTrades(
      trades,
      {
        fromTime:from.value,
        toTime:to.value,
        minPrice:min.value.trim(),
        maxPrice:max.value.trim()
      }
    );

    content.innerHTML=
      renderTradeTable(filtered,id);

    if(info){

      const parts=[];

      parts.push(
        `${fmtInteger(filtered.length)} معامله`
      );

      if(from.value || to.value){

        parts.push(
          `${from.value || "—"} تا ${to.value || "—"}`
        );
      }

      if(
        min.value.trim() ||
        max.value.trim()
      ){

        parts.push(
          `قیمت ${min.value || "—"} تا ${max.value || "—"}`
        );
      }

      info.textContent=parts.join(" · ");
    }
  }

  function clearFilter(){

    from.value="";
    to.value="";
    min.value="";
    max.value="";

    content.innerHTML=
      renderTradeTable(trades,id);

    if(info){
      info.textContent=
        `${fmtInteger(trades.length)} معامله دریافت‌شده از Worker`;
    }
  }

  apply.addEventListener("click",applyFilter);
  clear.addEventListener("click",clearFilter);

  [from,to,min,max].forEach(input=>{
    input.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        applyFilter();
      }
    });
  });
}

async function scanOnce(){
  if(!scanning) return;

  try{

    const strictness=
      Number($("strictness").value);

    const data=await fetchJson(
      `${WORKER_URL}/scan?strictness=${strictness}&t=${Date.now()}`
    );

    let list=[];

    if(Array.isArray(data?.results)){
      list=data.results;
    }else if(Array.isArray(data?.items)){
      list=data.items;
    }else if(Array.isArray(data)){
      list=data;
    }

    for(const item of list){
      const symbol=getSymbol(item);

      if(!symbol || closedCoins.has(symbol)){
        continue;
      }

      if(cards.has(symbol)){
        updateCard(item);
      }else{
        createCard(item);
      }

      startLive(symbol);
    }

    $("scanState").textContent=
      `🟢 اسکن فعال · ${list.length} نتیجه · بروزرسانی خودکار`;

  }catch(error){

    $("scanState").textContent=
      `🔴 خطای اسکن: ${error.message}`;
  }
}

function startScan(){
  if(scanning) return;

  scanning=true;

  $("startBtn").disabled=true;
  $("stopBtn").disabled=false;

  $("scanState").textContent=
    "🟢 اسکن بازار فعال شد...";

  scanOnce();

  scanTimer=setInterval(
    scanOnce,
    10000
  );
}

function stopScan(){
  scanning=false;

  if(scanTimer){
    clearInterval(scanTimer);
    scanTimer=null;
  }

  $("startBtn").disabled=false;
  $("stopBtn").disabled=false;

  $("scanState").textContent=
    "⏹ اسکن متوقف شد.";
}

$("analyzeBtn").addEventListener(
  "click",
  ()=>{
    analyzeSymbol(
      $("symbolInput").value
    );
  }
);

$("symbolInput").addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      e.preventDefault();

      analyzeSymbol(
        $("symbolInput").value
      );
    }
  }
);

$("startBtn").addEventListener(
  "click",
  startScan
);

$("stopBtn").addEventListener(
  "click",
  stopScan
);

$("stopBtn").disabled=false;

async function boot(){
  await checkHealth();
}

boot();

</script>
