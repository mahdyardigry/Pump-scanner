<!DOCTYPE html>
<html>
<head>

<title>🚀 Pump Scanner</title>

<style>

body{
background:#111;
color:white;
font-family:tahoma;
padding:20px;
}

.card{
background:#222;
padding:15px;
margin:10px 0;
border-radius:12px;
cursor:pointer;
}

.card:hover{
background:#333;
}

.green{
color:#00ff88;
}

.red{
color:#ff5555;
}

#chart{
margin-top:20px;
height:600px;
}

</style>

</head>


<body>


<h1>🚀 Pump Scanner</h1>


<div id="coins">
در حال دریافت اطلاعات...
</div>



<h2 id="title">
📈 TradingView Chart
</h2>


<div id="chart"></div>



<script>


async function loadCoins(){


let res = await fetch("/api/pumps");

let coins = await res.json();


let html="";


coins.forEach(c=>{


html += `

<div class="card" onclick="openChart('${c.symbol}')">


<h2>${c.symbol}</h2>


قیمت: ${c.price}<br>


تغییر 24h:
<span class="green">
🚀 ${c.change24h}%
</span>
<br>


حجم:
📊 ${Number(c.volume).toLocaleString()}
<br>


امتیاز پامپ:
🔥 ${c.pumpScore}
<br>


${c.dumpRisk > 0 
? 
'<span class="red">⚠️ Dump Risk '+c.dumpRisk+'%</span>'
:
'<span class="green">🚀 Pump</span>'
}



</div>


`;

});


document.getElementById("coins").innerHTML=html;


}




function openChart(symbol){


document.getElementById("title").innerHTML =
"📈 "+symbol+" Chart";


let pair =
"BINANCE:"+symbol+"USDT";



document.getElementById("chart").innerHTML=`

<div class="tradingview-widget-container">


<div id="tv_chart"></div>


</div>

`;



let script=document.createElement("script");


script.src=
"https://s3.tradingview.com/tv.js";


script.onload=function(){


new TradingView.widget({

container_id:"tv_chart",

width:"100%",

height:600,

symbol:pair,

interval:"15",

timezone:"Etc/UTC",

theme:"dark",

style:"1",

locale:"fa",

toolbar_bg:"#111",

enable_publishing:false,

hide_side_toolbar:false

});


};



document.getElementById("chart").appendChild(script);



}




loadCoins();


</script>


</body>
</html>
