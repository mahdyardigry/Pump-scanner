<!DOCTYPE html>
<html>
<head>
<title>🚀 Pump Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
background:#111;
color:white;
font-family:tahoma;
padding:20px;
}

.card{
background:#222;
padding:15px;
margin:10px 0;
border-radius:12px;
}

button{
background:#008cff;
color:white;
border:0;
padding:8px;
border-radius:8px;
}

iframe{
width:100%;
height:500px;
border:0;
margin-top:20px;
}

</style>
</head>

<body>

<h1>🚀 Pump Scanner</h1>

<div id="coins"></div>

<h2 id="title">📈 Chart</h2>

<div id="chartBox"></div>


<script>


async function loadCoins(){

let res = await fetch("/api/pumps");

let coins = await res.json();

let html="";


coins.forEach(c=>{

html+=`

<div class="card">

<h2>${c.symbol}</h2>

قیمت: ${c.price}<br>

تغییر 24h:
🚀 ${c.change24h}%<br>

حجم:
📊 ${Number(c.volume).toLocaleString()}<br>

امتیاز:
🔥 ${c.pumpScore}<br>

${c.signal || ""}<br>

ریسک دامپ:
⚠️ ${c.dumpRisk || 0}%


<br><br>

<button onclick="openChart('${c.symbol}')">
📈 نمایش چارت
</button>

</div>

`;

});


document.getElementById("coins").innerHTML=html;


}



function openChart(symbol){


let map={

"BTC":"BINANCE:BTCUSDT",
"ETH":"BINANCE:ETHUSDT",
"EUL":"BINANCE:EULUSDT",
"ON":"BINANCE:ONUSDT",
"PIPEDOG":"BINANCE:PIPEDOGUSDT"

};


let pair=map[symbol];


document.getElementById("title").innerHTML=
"📈 "+symbol+" Chart";


if(!pair){

document.getElementById("chartBox").innerHTML=
"❌ این ارز در TradingView پیدا نشد";

return;

}



document.getElementById("chartBox").innerHTML=`

<iframe
src="https://www.tradingview.com/widgetembed/?symbol=${pair}&interval=15">
</iframe>

`;


}



loadCoins();


</script>

</body>
</html>
