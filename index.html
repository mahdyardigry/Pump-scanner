<!DOCTYPE html>
<html>
<head>

<title>🚀 Pump Scanner</title>

<style>

body{
background:#111;
color:white;
font-family:tahoma;
padding:20px;
}

.card{
background:#222;
padding:15px;
margin:10px 0;
border-radius:12px;
}

button{
background:#008cff;
color:white;
border:0;
padding:10px 15px;
border-radius:8px;
}

iframe{
width:100%;
height:550px;
border:0;
margin-top:20px;
border-radius:12px;
}

</style>

</head>


<body>


<h1>🚀 Pump Scanner</h1>

<div id="coins"></div>

<h2 id="title">📈 Chart</h2>

<div id="chart">
</div>



<script>


async function loadCoins(){


try{

let res = await fetch("/api/pumps");

let coins = await res.json();


let html="";


coins.forEach(c=>{


html += `

<div class="card">

<h2>${c.symbol}</h2>

قیمت: ${c.price}<br>

تغییر 24h:
🚀 ${c.change24h}%<br>

حجم:
📊 ${Number(c.volume).toLocaleString()}<br>

امتیاز پامپ:
🔥 ${c.pumpScore}<br>

سیگنال:
${c.signal || ""}<br>

ریسک دامپ:
⚠️ ${c.dumpRisk || 0}%


<br><br>

<button onclick="showChart('${c.symbol}')">
📈 نمایش چارت
</button>


</div>

`;

});


document.getElementById("coins").innerHTML=html;


}catch(e){

document.getElementById("coins").innerHTML=
"خطا در دریافت اطلاعات";

}


}



function showChart(symbol){



let symbols={


"ON":"BINANCE:ONUSDT",

"PIPEDOG":"MEXC:PIPEDOGUSDT",

"EUL":"BINANCE:EULUSDT"


};



let tvSymbol = symbols[symbol];


if(!tvSymbol){

tvSymbol="BINANCE:"+symbol+"USDT";

}



document.getElementById("title").innerHTML=
"📈 "+symbol+" Chart";



document.getElementById("chart").innerHTML=


`

<iframe

src="https://www.tradingview.com/widgetembed/?symbol=${tvSymbol}&interval=15&theme=dark&style=1">

</iframe>

`;



}



loadCoins();


</script>


</body>
</html>
