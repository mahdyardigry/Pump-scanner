<!DOCTYPE html>
<html>
<head>

<title>🚀 Pump Scanner</title>

<style>

body{
background:#111;
color:white;
font-family:tahoma;
padding:20px;
}

.card{
background:#222;
padding:15px;
margin:10px 0;
border-radius:12px;
}

button{
background:#008cff;
color:white;
border:0;
padding:10px;
border-radius:8px;
}

iframe{
width:100%;
height:500px;
border:0;
margin-top:20px;
border-radius:10px;
}

</style>

</head>


<body>


<h1>🚀 Pump Scanner</h1>


<div id="coins"></div>


<h2 id="title">📈 Chart</h2>


<div id="chart"></div>



<script>


async function loadCoins(){


let res=await fetch("/api/pumps");

let coins=await res.json();


let html="";


coins.forEach(c=>{


html+=`

<div class="card">

<h2>${c.symbol}</h2>

قیمت: ${c.price}<br>

تغییر 24h:
🚀 ${c.change24h}%<br>

حجم:
📊 ${Number(c.volume).toLocaleString()}<br>

امتیاز:
🔥 ${c.pumpScore}<br>

${c.signal || ""}<br>

ریسک دامپ:
⚠️ ${c.dumpRisk || 0}%


<br><br>

<button onclick="showChart('${c.symbol}')">
📈 نمایش چارت
</button>


</div>


`;

});


document.getElementById("coins").innerHTML=html;


}



function showChart(symbol){


let tvSymbol="BINANCE:"+symbol+"USDT";


// اصلاح نمادها

if(symbol=="ON"){
tvSymbol="BINANCE:ONUSDT";
}


if(symbol=="PIPEDOG"){
tvSymbol="MEXC:PIPEDOGUSDT";
}


if(symbol=="EUL"){
tvSymbol="BINANCE:EULUSDT";
}



document.getElementById("title").innerHTML=
"📈 "+symbol+" Chart";



document.getElementById("chart").innerHTML=`

<iframe

src="https://www.tradingview.com/widgetembed/?symbol=${tvSymbol}&interval=15&theme=dark">

</iframe>

`;

}



loadCoins();


</script>


</body>
</html>
