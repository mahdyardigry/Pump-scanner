<!DOCTYPE html>
<html lang="fa">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🚀 Pump Scanner</title>

<style>

body{
background:#111;
color:white;
font-family:tahoma;
margin:0;
padding:15px;
}

h1{
text-align:center;
}

.card{
background:#222;
margin:10px 0;
padding:15px;
border-radius:10px;
}

button{
background:#00aaff;
color:white;
border:0;
padding:10px 15px;
border-radius:8px;
font-size:15px;
margin-top:10px;
cursor:pointer;
}

button:hover{
background:#0090dd;
}

#tvchart{
margin-top:20px;
height:650px;
background:#000;
border-radius:10px;
overflow:hidden;
}

</style>

</head>

<body>

<h1>🚀 Pump Scanner</h1>

<div id="coins"></div>

<h2 id="chartTitle">📈 TradingView Chart</h2>

<div id="tvchart"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

async function loadCoins(){

const res=await fetch("/api/pumps");
const coins=await res.json();

let html="";

coins.forEach(c=>{

html+=`

<div class="card">

<h2>${c.symbol}</h2>

قیمت:
${c.price}

<br><br>

تغییر 24 ساعت:
🚀 ${c.change24h}%

<br><br>

حجم:
📊 ${Number(c.volume).toLocaleString("fa-IR")}

<br><br>

امتیاز پامپ:
🔥 ${c.pumpScore}

<br><br>

سیگنال:
${c.signal}

<br><br>

ریسک دامپ:
⚠️ ${c.dumpRisk}%

<br><br>

<button onclick="showChart('${c.symbol}')">

📈 نمایش چارت

</button>

</div>

`;

});

document.getElementById("coins").innerHTML=html;

}

function showChart(symbol){

document.getElementById("chartTitle").innerHTML="📈 "+symbol;

document.getElementById("tvchart").innerHTML="";

new TradingView.widget({

container_id:"tvchart",

autosize:true,

symbol:"BINANCE:"+symbol+"USDT",

interval:"15",

timezone:"Etc/UTC",

theme:"dark",

style:"1",

locale:"en",

toolbar_bg:"#111",

enable_publishing:false,

allow_symbol_change:true,

hide_top_toolbar:false,

hide_legend:false,

save_image:false

});

}

loadCoins();

</script>

</body>

</html>
