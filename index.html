<!DOCTYPE html>
<html>
<head>

<title>🚀 Pump Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#111;
color:white;
font-family:tahoma;
padding:20px;
}

.card{
background:#222;
padding:15px;
margin:10px 0;
border-radius:12px;
}

button{
background:#008cff;
color:white;
border:0;
padding:10px;
border-radius:8px;
}

canvas{
background:white;
border-radius:10px;
margin-top:20px;
}

</style>

</head>


<body>


<h1>🚀 Pump Scanner</h1>


<div id="coins"></div>


<h2 id="title">📈 Chart</h2>


<canvas id="chart"></canvas>



<script>


let chart;



async function loadCoins(){


let res = await fetch("/api/pumps");

let coins = await res.json();


let html="";


coins.forEach(c=>{


html += `

<div class="card">

<h2>${c.symbol}</h2>

قیمت: ${c.price}<br>

تغییر 24h:
🚀 ${c.change24h}%<br>

حجم:
📊 ${Number(c.volume).toLocaleString()}<br>

امتیاز:
🔥 ${c.pumpScore}<br>

سیگنال:
${c.signal}<br>

ریسک دامپ:
⚠️ ${c.dumpRisk}%


<br><br>

<button onclick="showChart('${c.symbol}')">
📈 نمایش چارت
</button>


</div>

`;

});


document.getElementById("coins").innerHTML=html;


}





async function showChart(symbol){


document.getElementById("title").innerHTML =
"📈 "+symbol+" Chart";



let res = await fetch("/api/chart/"+symbol);


let data = await res.json();



let prices=data.map(x=>x.price);

let labels=data.map(x=>x.time);



if(chart){

chart.destroy();

}



chart = new Chart(

document.getElementById("chart"),

{

type:"line",

data:{


labels:labels,


datasets:[{

label:symbol,

data:prices,

borderWidth:3

}]


},


options:{

responsive:true

}


}

);



}





loadCoins();



</script>


</body>
</html>
