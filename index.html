<!DOCTYPE html>
<html>
<head>
<title>🚀 Pump Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
background:#111;
color:white;
font-family:tahoma;
padding:20px;
}

.card{
background:#222;
padding:15px;
margin:10px 0;
border-radius:12px;
}

button{
background:#008cff;
color:white;
border:0;
padding:8px 15px;
border-radius:8px;
margin-top:10px;
}

canvas{
background:white;
border-radius:10px;
margin-top:20px;
}
</style>

</head>

<body>

<h1>🚀 Pump Scanner</h1>

<div id="coins"></div>

<h2 id="chartTitle">📈 Chart</h2>

<canvas id="chart"></canvas>


<script>

let chart;


async function loadCoins(){

try{

let res = await fetch("/api/pumps");

let coins = await res.json();


let html="";


coins.forEach(c=>{

html += `

<div class="card">

<h2>${c.symbol}</h2>

قیمت: ${c.price}<br>

تغییر 24h:
🚀 ${c.change24h}%<br>

حجم:
📊 ${Number(c.volume).toLocaleString()}<br>

امتیاز:
🔥 ${c.pumpScore}<br>

سیگنال:
${c.signal || ""}<br>

ریسک دامپ:
${c.dumpRisk || 0}%


<br>

<button onclick="showChart('${c.symbol}',${c.price})">
📈 نمایش چارت
</button>

</div>

`;

});


document.getElementById("coins").innerHTML=html;


}catch(e){

document.getElementById("coins").innerHTML=
"خطا در دریافت اطلاعات";

}

}



function showChart(symbol,price){


document.getElementById("chartTitle").innerHTML =
"📈 "+symbol+" Chart";


let prices=[];


let p=Number(price);


for(let i=0;i<50;i++){

p=p+(Math.random()-0.45)*(p*0.02);

prices.push(Number(p.toFixed(4)));

}



if(chart){

chart.destroy();

}



chart=new Chart(

document.getElementById("chart"),

{

type:"line",

data:{

labels:Array.from(
{length:prices.length},
(_,i)=>i+1
),

datasets:[{

label:symbol,

data:prices,

borderWidth:2

}]

},

options:{

responsive:true

}

}

);


}



loadCoins();


</script>

</body>
</html>
