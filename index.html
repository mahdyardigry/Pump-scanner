<!DOCTYPE html>
<html>
<head>

<title>Pump Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#111;
color:white;
font-family:tahoma;
padding:20px;
}

.card{
background:#222;
padding:15px;
margin:10px 0;
border-radius:12px;
cursor:pointer;
}

.card:hover{
background:#333;
}

.green{
color:#00ff88;
}

.red{
color:#ff5555;
}

canvas{
background:white;
border-radius:10px;
margin-top:20px;
}

</style>

</head>


<body>


<h1>🚀 Pump Scanner</h1>


<div id="coins">
در حال دریافت دیتا...
</div>


<h2 id="chartTitle">
📈 Chart
</h2>


<canvas id="chart"></canvas>



<script>


let chart;



async function loadCoins(){


try{


let res = await fetch("/api/pumps");

let coins = await res.json();


let html="";


coins.forEach(c=>{


let signal = c.signal || "";


html += `

<div class="card" onclick="showChart('${c.symbol}')">


<h2>${c.symbol}</h2>


قیمت: ${c.price}<br>


تغییر 24h:

<span class="green">
🚀 ${c.change24h}%
</span>

<br>


حجم:

📊 ${Number(c.volume).toLocaleString()}

<br>


امتیاز پامپ:

🔥 ${c.pumpScore}


<br>


${signal}


</div>

`;



});


document.getElementById("coins").innerHTML=html;



}

catch(e){

document.getElementById("coins").innerHTML=
"❌ خطا در دریافت اطلاعات";

console.log(e);

}


}



async function showChart(symbol){


document.getElementById("chartTitle").innerHTML=
"📈 "+symbol+" Chart";


try{


let url =
"https://api.binance.com/api/v3/klines?symbol="
+symbol+
"USDT&interval=15m&limit=50";



let res = await fetch(url);


let data = await res.json();



if(!Array.isArray(data)){

throw new Error("Chart unavailable");

}



let prices=data.map(
x=>Number(x[4])
);



if(chart){

chart.destroy();

}



chart=new Chart(

document.getElementById("chart"),

{

type:"line",

data:{


labels:prices.map((x,i)=>i+1),


datasets:[{

label:symbol,

data:prices,

borderWidth:2

}]


},


options:{

responsive:true

}


}

);



}


catch(e){


document.getElementById("chartTitle").innerHTML=
"⚠️ چارت "+symbol+" موجود نیست";


if(chart){

chart.destroy();

}


console.log(symbol,e);


}



}



loadCoins();



</script>


</body>

</html>
