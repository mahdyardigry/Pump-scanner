<!DOCTYPE html>
<html>
<head>
<title>Pump Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#111;
color:white;
font-family:tahoma;
padding:20px;
}

.card{
background:#222;
padding:15px;
margin:10px;
border-radius:12px;
cursor:pointer;
}

.card:hover{
background:#333;
}

canvas{
background:white;
border-radius:10px;
}

</style>

</head>


<body>


<h1>🚀 Pump Scanner</h1>


<div id="coins"></div>


<h2 id="chartTitle">
📈 Chart
</h2>


<canvas id="chart"></canvas>



<script>


let chart;



async function loadCoins(){


const res = await fetch("/api/pumps");

const coins = await res.json();



let html="";



coins.forEach(c=>{


html += `


<div class="card" onclick="showChart('${c.symbol}')">


<h2>${c.symbol}</h2>

قیمت: ${c.price}<br>

تغییر 24h:
🚀 ${c.change24h}%<br>

حجم:
📊 ${c.volume}<br>

امتیاز:
🔥 ${c.pumpScore}


</div>


`;


});



document.getElementById("coins").innerHTML=html;



}



function showChart(symbol){


document.getElementById("chartTitle").innerHTML =
"📈 Chart "+symbol;



let prices=[];



let start=100;


for(let i=0;i<30;i++){

start = start + (Math.random()-0.45)*5;

prices.push(start.toFixed(2));

}



if(chart){

chart.destroy();

}



chart = new Chart(

document.getElementById("chart"),

{

type:"line",

data:{

labels:Array.from({length:30},(_,i)=>i+1),

datasets:[{

label:symbol,

data:prices,

borderWidth:2

}]

}


}

);



}



loadCoins();


</script>


</body>
</html>
