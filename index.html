<!DOCTYPE html>
<html>
<head>

<title>🚀 Pump Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#111;
color:white;
font-family:tahoma;
padding:20px;
}

.card{
background:#222;
padding:15px;
margin:12px 0;
border-radius:12px;
}

button{
background:#008cff;
color:white;
border:0;
padding:10px;
border-radius:8px;
margin-top:10px;
}

#chartBox{
background:white;
padding:10px;
border-radius:10px;
}

canvas{
max-height:400px;
}

.green{
color:#00ff88;
}

.red{
color:#ff4444;
}

</style>

</head>


<body>


<h1>🚀 Pump Scanner</h1>


<div id="coins">
در حال دریافت اطلاعات...
</div>


<h2 id="chartTitle">
📈 Chart
</h2>


<div id="chartBox">

<canvas id="chart"></canvas>

</div>



<script>


let chart=null;



async function loadCoins(){

try{


let response = await fetch("/api/pumps");


let coins = await response.json();



let html="";



coins.forEach(c=>{


let signal = c.signal || "";

let risk = c.dumpRisk || 0;



html += `

<div class="card">


<h2>${c.symbol}</h2>


قیمت:
${c.price}
<br>


تغییر 24h:

<span class="${Number(c.change24h)>=0?'green':'red'}">

🚀 ${c.change24h}%

</span>

<br>


حجم:

📊 ${Number(c.volume).toLocaleString()}

<br>


امتیاز پامپ:

🔥 ${c.pumpScore}


<br>


سیگنال:

${signal}


<br>


ریسک دامپ:

⚠️ ${risk}%


<br>


<button onclick="showChart('${c.symbol}',${c.price})">

📈 نمایش چارت

</button>


</div>


`;

});


document.getElementById("coins").innerHTML=html;



}

catch(error){

document.getElementById("coins").innerHTML=
"❌ خطا در دریافت اطلاعات";

}


}






function showChart(symbol,price){


document.getElementById("chartTitle").innerHTML=
"📈 "+symbol+" Chart";



let data=[];


let p=Number(price);



for(let i=0;i<60;i++){


let move=(Math.random()-0.48)*(p*0.015);


p=p+move;


data.push(Number(p.toFixed(6)));

}



if(chart){

chart.destroy();

}



chart=new Chart(

document.getElementById("chart"),

{

type:"line",


data:{


labels:data.map((x,i)=>i+1),


datasets:[{


label:symbol,


data:data,


borderWidth:2,


tension:0.3


}]


},



options:{


responsive:true,


plugins:{


legend:{


labels:{


color:"black"

}


}


}


}



}



);



}



loadCoins();


</script>



</body>
</html>
