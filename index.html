<!DOCTYPE html>
<html lang="fa">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pump Scanner</title>

<style>

body{
background:#111;
color:white;
font-family:tahoma;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

.card{

background:#222;
padding:15px;
margin-bottom:12px;
border-radius:12px;
cursor:pointer;
transition:.2s;

}

.card:hover{

background:#333;

}

iframe{

width:100%;
height:650px;
border:none;
border-radius:12px;
background:#000;

}

</style>

</head>

<body>

<h1>🚀 Pump Scanner</h1>

<div id="coins"></div>

<h2 id="chartTitle">
📈 Chart
</h2>

<iframe id="tvchart"></iframe>

<script>

async function loadCoins(){

const res=await fetch("/api/pumps");

const coins=await res.json();

let html="";

coins.forEach(c=>{

html+=`

<div class="card" onclick="showChart('${c.symbol}')">

<h2>${c.symbol}</h2>

قیمت:
${c.price}

<br><br>

تغییر 24h:
🚀 ${c.change24h}%

<br><br>

حجم:
📊 ${Number(c.volume).toLocaleString()}

<br><br>

امتیاز پامپ:
🔥 ${c.pumpScore}

</div>

`;

});

document.getElementById("coins").innerHTML=html;

}

function showChart(symbol){

document.getElementById("chartTitle").innerHTML="📈 "+symbol;

document.getElementById("tvchart").src=
"https://www.tradingview.com/chart/?symbol=BINANCE:"+symbol+"USDT";

}

loadCoins();

</script>

</body>

</html>
