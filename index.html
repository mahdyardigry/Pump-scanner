<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pump Scanner</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>🚀 Pump & Squeeze Scanner</h1>


<div id="status">
Loading...
</div>



<table>


<thead>

<tr>

<th>Coin</th>

<th>Price</th>

<th>24h %</th>

<th>OI Change</th>

<th>Long/Short</th>

<th>Score</th>

<th>Signal</th>

<th>Reason</th>

</tr>

</thead>


<tbody id="coins">

</tbody>


</table>



<script>


async function loadCoins(){


try{


const response =
await fetch("/api/pumps");



const data =
await response.json();



let html="";



data.forEach(c=>{


html += `

<tr>


<td>

<b>${c.symbol}</b>

<br>

${c.name}

</td>



<td>

${c.price}

</td>



<td>

${c.change24h}%

</td>



<td>

${c.oiChange}%

</td>



<td>

${c.longShort}

</td>



<td>

${c.score}

</td>



<td>

${c.signal}

</td>



<td>

${c.reason || "-"}

</td>



</tr>

`;



});



document.getElementById("coins").innerHTML =
html;



document.getElementById("status").innerHTML =

"Last Update: " + new Date().toLocaleTimeString();



}


catch(error){


document.getElementById("status").innerHTML =

"API Error";


}



}




loadCoins();


setInterval(

loadCoins,

60000

);



</script>



</body>

</html>
